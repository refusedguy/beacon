# BCX-54 / S7.011. Seed-спецификация artery "seeded regression".
#
# Источники данных, все из репозитория:
#   docs/tasks/S7.011.md                        четыре именованных seed-отказа
#   docs/evals/w25-seed-regression-artery.md    порядок прогонов и негативный контроль
#   docs/adrs/0214-seeded-regression.md         требование пары healthy + seeded
#
# Файл исполняемый. internal/testsystem читает его, fault controller внедряет
# четыре отказа, а CI-шаг seed-spec прогоняет healthy -> seeded -> healthy_again
# и требует fail на маркере expect_marker. grep по именам больше не проверка.
schema: beacon.seeded-regression/v1

sources:
  card: docs/tasks/BCX-54.md
  seeds: docs/tasks/S7.011.md
  runs: docs/evals/w25-seed-regression-artery.md
  adr: docs/adrs/0214-seeded-regression.md

seeds:
  - id: lost_baton
    fault: lost baton
    source: docs/tasks/S7.011.md
    value: 1001
    code: 1
    marker: fault.lost_baton
  - id: late_event
    fault: late event
    source: docs/tasks/S7.011.md
    value: 1002
    code: 2
    marker: fault.late_event
  - id: pruned_cursor
    fault: pruned cursor
    source: docs/tasks/S7.011.md
    value: 1003
    code: 3
    marker: fault.pruned_cursor
  - id: duplicate_client_request_id
    fault: duplicate clientRequestId
    source: docs/tasks/S7.011.md
    value: 1004
    code: 4
    marker: fault.duplicate_client_request_id

runs:
  - name: healthy
    seed: none
    expect: pass
  - name: seeded
    seed: [lost_baton, late_event, pruned_cursor, duplicate_client_request_id]
    expect: fail_at_expect
    expect_marker: fault.lost_baton
  - name: healthy_again
    seed: none
    expect: pass

negative_control:
  seed: none
  expect: no_diagnostic_value
  description: Убрать seed и показать, что тест ничего не доказывает.
