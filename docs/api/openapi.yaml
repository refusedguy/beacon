openapi: 3.1.0
info:
  title: Beacon loopback projection API
  version: 1.0.0
  description: >-
    Read-only snapshot and SSE stream of Beacon state plus one human command.
    The server binds 127.0.0.1 only. The endpoint and its bearer token live in
    <stateDir>/connection.json with mode 0600. The UI is not part of Beacon;
    this contract exists so a future one can be built against a stable wire
    shape. ADR 0025 keeps the stream as notifications: a client re-reads the
    snapshot instead of treating events as state.
servers:
  - url: "http://127.0.0.1:{port}"
    description: Loopback listener chosen by the daemon.
    variables:
      port:
        default: "7432"
        description: Port recorded in connection.json.
security:
  - bearerAuth: []
tags:
  - name: projection
    description: Read-only views of Beacon state.
  - name: control
    description: Commands issued by a human through the loopback listener.

paths:
  /api/v1/health:
    get:
      tags: [projection]
      operationId: getHealth
      summary: Liveness and load status
      description: >-
        Returns 200 even when a store read failed. The failure is reported in
        loadErrors and ok is false, so a UI can tell a live process from a
        healthy one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Process status with an optional list of load errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  summary: All stores loaded
                  value:
                    ok: true
                    version: v0.12.0
                    pid: 42173
                    projectKey: beacon-main
                    isPollerOwner: true
                    uptimeSec: 5421
                    loadErrors: []
                degraded:
                  summary: A provider failed to load
                  value:
                    ok: false
                    version: v0.12.0
                    pid: 42173
                    projectKey: beacon-main
                    isPollerOwner: false
                    uptimeSec: 12
                    loadErrors:
                      - "snapshot: store down"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/snapshot:
    get:
      tags: [projection]
      operationId: getSnapshot
      summary: Complete view of Beacon state
      description: >-
        One call yields one consistent view. The fields recentWatches and
        hourlyStats are optional and absent when the provider has no history
        source. Recent watches are the newest 30 completed Watches with an
        outcome of merged, closed or escalated, newest first by closedAt.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
              examples:
                withHistory:
                  summary: Provider supplies the history block
                  value:
                    liveWatches: []
                    blockerIncidents: []
                    escalations: []
                    pointStats:
                      used: 12
                      budget: 500
                    metrics:
                      poll_cycles_total: 3
                    lastCycle:
                      at: "2026-11-20T12:00:00Z"
                      watchesUpdated: 2
                      durationMs: 15
                    loadErrors: []
                    recentWatches:
                      - id: w1
                        repo: refusedguy/beacon
                        pr: 7
                        headSHA: abc123
                        outcome: merged
                        closedAt: "2026-11-20T11:58:00Z"
                    hourlyStats:
                      points: 12
                      merges: 3
                      blockers: 1
                withoutHistory:
                  summary: Legacy provider without a history source
                  value:
                    liveWatches: []
                    blockerIncidents: []
                    escalations: []
                    pointStats:
                      used: 0
                      budget: 500
                    metrics: {}
                    lastCycle:
                      watchesUpdated: 0
                      durationMs: 0
                    loadErrors: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: The state provider failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                failed:
                  value:
                    ok: false
                    code: SNAPSHOT_FAILED
                    message: "no store"

  /api/v1/events:
    get:
      tags: [projection]
      operationId: streamEvents
      summary: Server-sent event stream
      description: >-
        Long-lived text/event-stream. Each frame has an id, a sanitized event
        name and a JSON data payload matching the Event schema. A client can
        replay buffered frames with ?replay=N or the Last-Event-ID header.
        Heartbeat frames are comments beginning with a colon and carry no data.
      security:
        - bearerAuth: []
      parameters:
        - name: replay
          in: query
          required: false
          description: Number of most recent buffered frames to send before live ones. Capped at 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume after this event id. Takes precedence over replay.
          schema:
            type: string
      responses:
        "200":
          description: Event stream. The schema describes one data payload.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
              examples:
                frame:
                  summary: One frame, shown as its data payload
                  value:
                    id: 42
                    type: human.decide
                    at: "2026-11-20T12:01:00Z"
                    watchID: w1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: The writer cannot stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unsupported:
                  value:
                    ok: false
                    code: STREAM_UNSUPPORTED
                    message: "writer не поддерживает поток"

  /api/v1/human/decide:
    post:
      tags: [control]
      operationId: decide
      summary: Apply one human command
      description: >-
        The same command, watchID, obligationID and note replay the cached reply
        with applied set to false. A browser must send an Origin matching the
        loopback listener; callers without Origin are allowed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
            examples:
              approve:
                summary: Approve a pending decision
                value:
                  command: approve
                  watchID: w1
                  obligationID: journal-9
                  note: ok
                  actor: human
              unblock:
                summary: Clear the block on a Watch
                value:
                  command: unblock
                  watchID: w2
      responses:
        "200":
          description: Accepted or idempotently repeated command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
              examples:
                applied:
                  value:
                    ok: true
                    command: approve
                    watchID: w1
                    applied: true
                    decisionID: journal-9
                    status: watching/ready
                repeated:
                  value:
                    ok: true
                    command: approve
                    watchID: w1
                    applied: false
                    decisionID: journal-9
                    status: watching/ready
        "400":
          $ref: "#/components/responses/BadInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: The decision sink failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                failed:
                  value:
                    ok: false
                    code: DECISION_FAILED
                    message: "journal unavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Token read from connection.json. The server compares the Authorization
        header against "Bearer <token>" in constant time. Every route requires
        it, including the health check and the event stream.

  responses:
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthorized:
              value:
                ok: false
                code: UNAUTHORIZED
                message: "неверный bearer-токен"
    BadInput:
      description: Unknown command, empty watchID or malformed JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            badCommand:
              value:
                ok: false
                code: INVALID_INPUT
                message: "неизвестная команда destroy"
    Forbidden:
      description: Origin did not match the loopback listener.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                ok: false
                code: FORBIDDEN
                message: "Origin не совпадает с адресом сервера"
    UnsupportedMediaType:
      description: Content-Type was not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            wrongType:
              value:
                ok: false
                code: INVALID_INPUT
                message: "нужен Content-Type: application/json"

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [ok, code, message]
      properties:
        ok:
          type: boolean
          description: Always false on an error response.
        code:
          type: string
          description: Stable machine-readable code.
          examples: [UNAUTHORIZED, INVALID_INPUT, FORBIDDEN, SNAPSHOT_FAILED, DECISION_FAILED, STREAM_UNSUPPORTED]
        message:
          type: string
          description: Human-readable reason in Russian.

    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, version, pid, projectKey, isPollerOwner, uptimeSec, loadErrors]
      properties:
        ok:
          type: boolean
        version:
          type: string
        pid:
          type: integer
        projectKey:
          type: string
        isPollerOwner:
          type: boolean
        uptimeSec:
          type: integer
          minimum: 0
        loadErrors:
          type: array
          items:
            type: string

    PointStats:
      type: object
      additionalProperties: false
      required: [used, budget]
      properties:
        used:
          type: integer
        budget:
          type: integer

    LastCycle:
      type: object
      additionalProperties: false
      required: [watchesUpdated, durationMs]
      properties:
        at:
          type: string
          format: date-time
          description: Omitted when no cycle has completed yet.
        watchesUpdated:
          type: integer
        durationMs:
          type: integer

    Check:
      type: object
      additionalProperties: false
      required: [state, conclusion, required, detailsUrl]
      properties:
        state:
          type: string
        conclusion:
          type: string
        required:
          type: boolean
        detailsUrl:
          type: string

    MergeInfo:
      type: object
      additionalProperties: false
      required: [mergeable, mergeStateStatus, reviewDecision]
      properties:
        mergeable:
          type: string
        mergeStateStatus:
          type: string
        reviewDecision:
          type: string

    FlakyConfig:
      type: object
      additionalProperties: false
      required: [names, maxRetries, used]
      properties:
        names:
          type: array
          items:
            type: string
        maxRetries:
          type: integer
        used:
          type: object
          additionalProperties:
            type: integer

    Policy:
      type: object
      additionalProperties: false
      required: [requireUpToDate, ignoreReviews, maxWakesPerWatch]
      properties:
        requireUpToDate:
          type: boolean
        ignoreReviews:
          type: boolean
        maxWakesPerWatch:
          type: integer
        maxRebases:
          type: integer
          description: Omitted when the project set no rebase budget.

    MergePolicy:
      type: object
      additionalProperties: false
      required: [autoMerge, requireApproval, waitFor, waitForMain]
      properties:
        autoMerge:
          type: boolean
        requireApproval:
          type: boolean
        waitFor:
          type: array
          items:
            type: string
        waitForMain:
          type: array
          items:
            type: string

    Subscriber:
      type: object
      additionalProperties: false
      required: [id, role, adapter, target, addedAt, lastActivity]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [executor, orchestrator, fixer]
        adapter:
          type: string
        target:
          type: string
        orchestratorID:
          type: string
        fixFor:
          type: string
        phase:
          type: string
          enum: [waiting, in_work, blocked, orphaned, finished]
        lastWakeAt:
          type: string
          format: date-time
        lastError:
          type: string
        addedAt:
          type: string
          format: date-time
        lastActivity:
          type: string
          format: date-time

    BlockedInfo:
      type: object
      additionalProperties: false
      required: [reason, since, blockedBy]
      properties:
        reason:
          type: string
        failedChecks:
          type: array
          items:
            type: string
        since:
          type: string
          format: date-time
        blockedBy:
          type: string
        fixAttempts:
          type: integer

    Watch:
      type: object
      additionalProperties: false
      required: [id, repo, pr, headSHA, baseRef, issue, status, verdict, revision, checks, merge, flaky, policy, mergePolicy, subscribers, deadlineAt, noChecksSince, createdAt, closedAt, closeReason]
      properties:
        id:
          type: string
        repo:
          type: string
        pr:
          type: integer
        headSHA:
          type: string
        baseRef:
          type: string
        issue:
          type: string
        status:
          type: string
          enum: [watching, notifying, blocked, closed, needs_input, parked]
        verdict:
          type: string
          enum: [watching, ready, rebase, retry, keep_working, timeout, merged, closed, blocked, needs_input, parked, accepted]
        blocked:
          $ref: "#/components/schemas/BlockedInfo"
        revision:
          type: integer
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Check"
        merge:
          $ref: "#/components/schemas/MergeInfo"
        flaky:
          $ref: "#/components/schemas/FlakyConfig"
        policy:
          $ref: "#/components/schemas/Policy"
        mergePolicy:
          $ref: "#/components/schemas/MergePolicy"
        subscribers:
          type: array
          items:
            $ref: "#/components/schemas/Subscriber"
        orchestratorID:
          type: string
        fixFor:
          type: string
        blockerID:
          type: string
        fixBlockerID:
          type: string
        deadlineAt:
          type: string
          format: date-time
        noChecksSince:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        closeReason:
          type: string

    BlockerIncident:
      type: object
      additionalProperties: false
      required: [id, repo, baseRef, signature, failedChecks, blockedWatchIDs, fixAttempts, maxFixAttempts, status, createdAt, resolvedAt]
      properties:
        id:
          type: string
        repo:
          type: string
        baseRef:
          type: string
        signature:
          type: string
        failedChecks:
          type: array
          items:
            type: string
        blockedWatchIDs:
          type: array
          items:
            type: string
        fixerWatchID:
          type: string
        fixAttempts:
          type: integer
        maxFixAttempts:
          type: integer
        status:
          type: string
          enum: [open, resolved]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time

    OrchestratorBinding:
      type: object
      additionalProperties: false
      required: [projectKey, sessionID, adapter, boundAt]
      properties:
        projectKey:
          type: string
        sessionID:
          type: string
        adapter:
          type: string
        boundAt:
          type: string
          format: date-time

    WatchHistory:
      type: object
      additionalProperties: false
      required: [id, repo, pr, headSHA, outcome, closedAt]
      properties:
        id:
          type: string
        repo:
          type: string
        pr:
          type: integer
        headSHA:
          type: string
        outcome:
          type: string
          enum: [merged, closed, escalated]
        closedAt:
          type: string
          format: date-time
        closeReason:
          type: string

    HourlyStats:
      type: object
      additionalProperties: false
      required: [points, merges, blockers]
      properties:
        points:
          type: integer
        merges:
          type: integer
        blockers:
          type: integer

    SnapshotResponse:
      type: object
      additionalProperties: false
      required: [liveWatches, blockerIncidents, escalations, pointStats, metrics, lastCycle, loadErrors]
      properties:
        liveWatches:
          type: array
          items:
            $ref: "#/components/schemas/Watch"
        blockerIncidents:
          type: array
          items:
            $ref: "#/components/schemas/BlockerIncident"
        boundOrchestrator:
          $ref: "#/components/schemas/OrchestratorBinding"
        escalations:
          type: array
          items:
            type: string
        pointStats:
          $ref: "#/components/schemas/PointStats"
        metrics:
          type: [object, "null"]
          additionalProperties: true
          description: Raw runtime stats. Null when the provider has no sample.
        lastCycle:
          $ref: "#/components/schemas/LastCycle"
        loadErrors:
          type: array
          items:
            type: string
        recentWatches:
          type: array
          description: Newest 30 completed Watches, newest first. Omitted without a history provider.
          items:
            $ref: "#/components/schemas/WatchHistory"
        hourlyStats:
          $ref: "#/components/schemas/HourlyStats"
          description: Omitted without a history provider.

    Event:
      type: object
      additionalProperties: false
      required: [id, type, at]
      properties:
        id:
          type: integer
        type:
          type: string
          description: Event name after sanitizing for the SSE event field.
        at:
          type: string
          format: date-time
        watchID:
          type: string
        payload:
          type: object
          additionalProperties: true

    Decision:
      type: object
      additionalProperties: false
      required: [command, watchID]
      properties:
        command:
          type: string
          enum: [approve, reject, context, rework, pause, resume, unblock, cancel, force_retry_merge]
        watchID:
          type: string
          minLength: 1
        obligationID:
          type: string
        note:
          type: string
        actor:
          type: string

    DecisionResult:
      type: object
      additionalProperties: false
      required: [ok, command, watchID, applied, decisionID]
      properties:
        ok:
          type: boolean
        command:
          type: string
          enum: [approve, reject, context, rework, pause, resume, unblock, cancel, force_retry_merge]
        watchID:
          type: string
        applied:
          type: boolean
          description: False on an idempotent repeat.
        decisionID:
          type: string
        status:
          type: string
