name: CI

# Компиляция, тесты и гейты Beacon. Общая проверка для push в main и pull request.
# Внешние секреты и токен GitHub не нужны: только чтение репозитория и локальный Go.
# Версия Go берётся из go.mod через go-version-file.
on:
  push:
    branches: [main]
    # Документация и спайки не меняют код. Такой коммит не должен гонять
    # компиляцию, тесты и гейты. По образцу Harbor ci.yml:120.
    paths-ignore: ['**.md', 'docs/**', 'worktrees/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'worktrees/**']

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/beacon-gates/go.sum') }}-build-v2

      - name: Build beacon
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-buildid= -s -w" \
            -o beacon ./cmd/beacon
          printf 'build ok binary=beacon\n'

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/beacon-gates/go.sum') }}-test-v2

      - name: Download modules
        shell: bash
        run: |
          set -euo pipefail
          go mod download

      - name: Test root module
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Test gates module
        working-directory: tools/beacon-gates
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Test JS adapters
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests/adapter ]; then
            find tests/adapter -maxdepth 1 -name '*.test.js' -print0 | xargs -0 -r node --test
          else
            printf 'tests/adapter not present, skipping JS adapter tests\n'
          fi

  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', 'tools/beacon-gates/go.sum') }}-gates-v2

      - name: Check committed gates binary
        shell: bash
        run: |
          set -euo pipefail
          bin=tools/beacon-gates/beacon-gates
          if [ ! -x "$bin" ]; then
            printf 'missing committed gates binary: %s\n' "$bin" >&2
            exit 2
          fi
          printf 'gates binary present path=%s\n' "$bin"

      - name: Self-test every gate
        shell: bash
        run: |
          set -euo pipefail
          bin=tools/beacon-gates/beacon-gates
          "$bin" --list
          for gate in capabilities layers-ast layers-list; do
            printf 'self-test gate=%s\n' "$gate"
            "$bin" "$gate" --self-test
          done

      - name: Run gates on tree
        shell: bash
        run: |
          set -euo pipefail
          bin=tools/beacon-gates/beacon-gates
          for gate in capabilities layers-ast layers-list; do
            printf 'gate gate=%s\n' "$gate"
            "$bin" "$gate"
          done

  # Пока не делаем e2e обязательным для merge: job запускает реальный
  # opencode 2.3.0 и зависит от его бинарника в runner. continue-on-error
  # поэтому он не блокирует остальные job, пока прогон не станет стабильным.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'

      # npm-пакет opencode-ai 2.3.0 не существует, а @opencode/cli 2.3.0
      # требует postinstall, который npm 12 блокирует. Прямое извлечение
      # бинарника из платформенного tarball проверено локально: opencode v2.3.0.
      - name: Install opencode 2.3.0
        shell: bash
        run: |
          set -euo pipefail
          version=2.3.0
          work="$RUNNER_TEMP/opencode-install"
          mkdir -p "$work" "$HOME/.opencode/bin"
          curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-${version}.tgz" \
            -o "$work/opencode.tgz"
          tar -xzf "$work/opencode.tgz" -C "$work"
          cp "$work/package/bin/opencode" "$HOME/.opencode/bin/opencode"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Run e2e
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          bash tests/e2e/run.sh
