name: ci

on:
  push:
    branches: [main, refactor/clean-core]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!AGENTS.md'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!AGENTS.md'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One shared filter feeds every gate. Output names are pinned here so a typo
  # in a consumer cannot silently turn into a skipped job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go-core: ${{ steps.all.outputs.go_core || steps.filter.outputs.go_core }}
      go-acp: ${{ steps.all.outputs.go_acp || steps.filter.outputs.go_acp }}
      go-opencode: ${{ steps.all.outputs.go_opencode || steps.filter.outputs.go_opencode }}
      go-tui: ${{ steps.all.outputs.go_tui || steps.filter.outputs.go_tui }}
      plugin: ${{ steps.all.outputs.plugin || steps.filter.outputs.plugin }}
      smoke: ${{ steps.all.outputs.smoke || steps.filter.outputs.smoke }}
      perf: ${{ steps.all.outputs.perf || steps.filter.outputs.perf }}
      shared: ${{ steps.all.outputs.shared || steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scheduled and manually started runs have no diff to filter. Every
      # output is true there so the nightly and the full suite always run.
      - name: Enable all paths for scheduled and manual runs
        id: all
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for key in go_core go_acp go_opencode go_tui plugin smoke perf shared; do
            echo "${key}=true" >> "$GITHUB_OUTPUT"
          done

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            go_core:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'arch_test.go'
              - 'go.mod'
              - 'go.sum'
            go_acp:
              - 'harnesses/acp/**'
            go_opencode:
              - 'harnesses/opencode/**'
            go_tui:
              - 'ui/tui/**'
            plugin:
              - '.opencode/plugins/beacon-project/**'
              - 'opencode.json'
              - 'scripts/plugin-tui-smoke.sh'
              - '.github/workflows/ci.yml'
            smoke:
              - 'scripts/bench-e2e.sh'
              - 'internal/bench/**'
              - '.github/workflows/ci.yml'
            perf:
              - 'scripts/check-bench-regression.sh'
              - 'internal/bench/**'
              - 'docs/perf/**'
              - '.github/workflows/ci.yml'
            shared:
              - 'AGENTS.md'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'

  mark-ready:
    # Ordinary PRs need no operator action to satisfy merge.labels.
    # Perf PRs are intentionally skipped: their worker sets the label after
    # the last variant has been measured.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Add ready-to-merge label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ready-to-merge'],
            })

  warm-cache:
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs['go-core'] == 'true' ||
       needs.changes.outputs['go-acp'] == 'true' ||
       needs.changes.outputs['go-opencode'] == 'true' ||
       needs.changes.outputs['go-tui'] == 'true' ||
       needs.changes.outputs.smoke == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - name: Build root module
        run: go build ./...

      - name: Build ACP harness module
        working-directory: harnesses/acp
        run: go build ./...

      - name: Build OpenCode harness module
        working-directory: harnesses/opencode
        run: go build ./...

      - name: Build TUI module
        working-directory: ui/tui
        run: |
          go build ./...
          rm -f tui

      - name: Compile root test packages with race
        run: go test -race -run '^$' ./cmd/... ./internal/app/... ./internal/infra/... ./internal/bench/... . ./pkg/...

      - name: Compile ACP test packages with race
        working-directory: harnesses/acp
        run: go test -race -run '^$' ./...

      - name: Compile OpenCode test packages with race
        working-directory: harnesses/opencode
        run: go test -race -run '^$' ./...

      - name: Compile TUI test packages with race
        working-directory: ui/tui
        run: go test -race -run '^$' ./...

  verify:
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs['go-core'] == 'true' ||
       needs.changes.outputs['go-acp'] == 'true' ||
       needs.changes.outputs['go-opencode'] == 'true' ||
       needs.changes.outputs['go-tui'] == 'true' ||
       needs.changes.outputs.plugin == 'true')
    needs: [changes, warm-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - name: Build root module
        run: go build ./...

      - name: Build ACP harness module
        working-directory: harnesses/acp
        run: go build ./...

      - name: Build OpenCode harness module
        working-directory: harnesses/opencode
        run: go build ./...

      - name: Build TUI module
        working-directory: ui/tui
        run: |
          go build ./...
          rm -f tui

      # Root govet runs once inside golangci-lint. The wrapper modules are
      # separate modules, so their vet steps stay explicit and acp joins them.
      - name: Vet ACP harness module
        working-directory: harnesses/acp
        run: go vet ./...

      - name: Vet OpenCode harness module
        working-directory: harnesses/opencode
        run: go vet ./...

      - name: Vet TUI module
        working-directory: ui/tui
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l cmd internal pkg harnesses ui arch_test.go)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15

      - name: Plugin syntax check
        run: |
          node --check .opencode/plugins/beacon-project/ui/ui_runtime.js
          node --check .opencode/plugins/beacon-project/ui/ui.js
          node --check .opencode/plugins/beacon-project/test_support/plugin_loader.js
          node --check .opencode/plugins/beacon-project/test_support/register_plugin_doubles.js

      - name: Plugin tests
        run: node --import ./.opencode/plugins/beacon-project/test_support/register_plugin_doubles.js --test ".opencode/plugins/beacon-project/**/*_test.js"

  build:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "build passed in verify"

  vet:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "vet passed in verify"

  lint:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "lint passed in verify"

  test-modules:
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs['go-core'] == 'true' ||
       needs.changes.outputs['go-acp'] == 'true' ||
       needs.changes.outputs['go-opencode'] == 'true' ||
       needs.changes.outputs['go-tui'] == 'true' ||
       needs.changes.outputs.smoke == 'true')
    needs: [changes, warm-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root command
            filter: go-core
            dir: .
            packages: ./cmd/...
            race: true
          - module: root app
            filter: go-core
            dir: .
            packages: ./internal/app/...
            race: true
          - module: root infra
            filter: go-core
            dir: .
            packages: ./internal/infra/...
            race: true
          - module: root bench
            filter: go-core
            dir: .
            packages: ./internal/bench/...
            race: true
            smoke: true
          - module: root dot
            filter: go-core
            dir: .
            packages: .
            race: false
            verbose: true
          - module: root core
            filter: go-core
            dir: .
            packages: ./pkg/...
            race: false
          - module: acp
            filter: go-acp
            dir: harnesses/acp
            packages: ./...
            race: false
          - module: opencode
            filter: go-opencode
            dir: harnesses/opencode
            packages: ./...
            race: true
          - module: tui
            filter: go-tui
            dir: ui/tui
            packages: ./...
            race: true
    steps:
      - uses: actions/checkout@v4

      # The module name joins the common dependency hash, so each leg restores
      # the cache it wrote instead of racing four other legs for one key.
      - name: Set per-leg cache key
        run: printf '%s\n' '${{ matrix.module }}' > ci-cache-key.txt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum
            ci-cache-key.txt

      - name: Test ${{ matrix.module }} module
        if: needs.changes.outputs.shared == 'true' || needs.changes.outputs[matrix.filter] == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          go test ${{ matrix.race && '-race' || '' }} ${{ matrix.verbose && '-v' || '' }} -shuffle=on ${{ matrix.packages }} 2>&1 | tee test-output.txt

      # Advisory annotations come from the same test run, not a second go test.
      - name: Advisory annotations
        if: matrix.module == 'root dot' && (needs.changes.outputs.shared == 'true' || needs.changes.outputs[matrix.filter] == 'true')
        run: |
          while IFS= read -r line; do
            case "$line" in
              *ADVISORY:*)
                message="${line#*ADVISORY:}"
                message="${message#"${message%%[![:space:]]*}"}"
                printf '::warning::%s\n' "$message"
                ;;
            esac
          done < test-output.txt

      # perf-smoke had no timing gate and recompiled the bench binary on a
      # fresh runner. It runs inside the root bench leg now. No timing gate is
      # added here: CI timing stays on the perf runner.
      - name: Bounded benchmark smoke
        if: matrix.smoke && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.smoke == 'true')
        run: timeout 30s bash scripts/bench-e2e.sh --smoke

  test:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: test-modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "all module suites passed"

  plugin-tui-smoke:
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.shared == 'true' || needs.changes.outputs.plugin == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache OpenCode CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-cli-${{ hashFiles('.opencode/plugins/beacon-project/supported-cli.json') }}

      - name: Add OpenCode CLI to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install the supported OpenCode CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          VERSION="$(node -p "require('./.opencode/plugins/beacon-project/supported-cli.json').cliVersion")"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path

      - name: Boot OpenCode TUI with the Beacon plugin
        run: bash scripts/plugin-tui-smoke.sh

  perf-pr-advisory:
    # Two-tree, alternating comparison for a labeled PR. It never gates merge,
    # adds no required Criterion name, and always exits zero.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install benchstat
        continue-on-error: true
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c

      - name: Build two detached worktrees
        id: trees
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"
          git fetch origin "$BASE_REF" || true
          git fetch origin "$BASE_BRANCH" || true
          BASE="$(git merge-base "$BASE_REF" "$HEAD_REF")"
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/perf-head" "$HEAD_REF"
          # Both trees must run the same known-good UI mirror. Take it from the
          # PR base branch: the labeled PR's own head can still carry the stale
          # mirror that aborts the pass. Write it into both worktrees before
          # the changed-file loop so the loop cannot replace it with head's.
          git show "origin/$BASE_BRANCH:internal/bench/ui_bench.js" \
            > "$RUNNER_TEMP/perf-base/internal/bench/ui_bench.js"
          git show "origin/$BASE_BRANCH:internal/bench/ui_bench.js" \
            > "$RUNNER_TEMP/perf-head/internal/bench/ui_bench.js"
          # Harness changes must be identical on both sides. Production code
          # stays at its own tree's revision, so plugin files are never copied.
          while IFS= read -r path; do
            case "$path" in
              internal/bench/ui_bench.js) continue ;;
              internal/bench/*|docs/perf/*|internal/infra/workspace/git_worktree_test.go)
                if [[ -f "$RUNNER_TEMP/perf-head/$path" ]]; then
                  mkdir -p "$RUNNER_TEMP/perf-base/$(dirname "$path")"
                  cp "$RUNNER_TEMP/perf-head/$path" "$RUNNER_TEMP/perf-base/$path"
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD_REF")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Run A B B A B A passes
        continue-on-error: true
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/perf-base.txt"
          : > "$RUNNER_TEMP/perf-head.txt"
          : > "$RUNNER_TEMP/perf-status"
          run_side() {
            local side="$1" dir="$2"
            {
              echo "== pass $side =="
              (cd "$dir" && BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench 'BenchmarkReconcileTickCounts|BenchmarkBaseRedCheck|BenchmarkBaseRedBlockFanout' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkSQLiteSnapshot$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkPlannerSelectInjectedChecker$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkSpawnPrompt$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && BEACON_BENCH_SMOKE=1 GOMAXPROCS=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkHotPaths$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && go test ./internal/infra/workspace/ -run '^TestGitWorktreeRemoveLatencyAlternating$' -count=1 -v) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && BENCH_ITERATIONS=50 BENCH_WARMUP=0 node internal/bench/ui_bench.js) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && BENCH_TICKS=1001 BENCH_ROUNDS=5 node internal/bench/run_watcher_bench.js) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
            } 2>&1 | tee -a "$RUNNER_TEMP/perf-$side.txt"
          }
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"

      - name: Write per-side CSV and comparison
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p perf-results
          benchstat="$(go env GOPATH)/bin/benchstat"
          "$benchstat" -format csv "$RUNNER_TEMP/perf-base.txt" > perf-results/base.csv
          "$benchstat" -format csv "$RUNNER_TEMP/perf-head.txt" > perf-results/head.csv
          "$benchstat" -format csv "$RUNNER_TEMP/perf-base.txt" "$RUNNER_TEMP/perf-head.txt" \
            > perf-results/compare.csv

      # One comment per PR. Ranges that overlap are reported as inconclusive,
      # so a noisy head run cannot be presented as a gain.
      - name: Build comparison comment
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const temp = process.env.RUNNER_TEMP;
          const sides = {
            base: fs.readFileSync(`${temp}/perf-base.txt`, 'utf8'),
            head: fs.readFileSync(`${temp}/perf-head.txt`, 'utf8'),
          };
          const statusPath = `${temp}/perf-status`;
          const status = fs.existsSync(statusPath)
            ? fs.readFileSync(statusPath, 'utf8').trim() : '';
          // go test prints custom metrics as "<value> <name>". Only wired
          // benchmark rows are parsed from that tail.
          const metricNames = ['mcp-journal', 'redaction', 'wire-encode', 'prompt-build',
            'snapshot', 'reconcile-tick-counts', 'base-red-check', 'base-red-block',
            'scm-observe', 'card-local-parse', 'http-snapshot-assembly', 'harness-spawn'];
          const wanted = ['planner-select', 'prompt-build', 'mcp-journal',
            'redaction', 'wire-encode', 'tui-view',
            'reconcile-tick-counts', 'base-red-check', 'base-red-block',
            'snapshot', 'worktree-remove', 'run-watcher-fp', 'run-watcher-fp-chars',
            'scm-observe', 'card-local-parse', 'http-snapshot-assembly', 'harness-spawn'];
          const limiters = {
            'mcp-journal': 'mutex + indexed LRU',
            'redaction': 'regexp pass chain',
            'wire-encode': 'encoding/json reflection',
            'tui-view': 'normalizeSnapshot + render',
            'planner-select': 'injected overlap checker',
            'prompt-build': 'strings.Builder + prompt bytes',
            'reconcile-tick-counts': 'Source.ListAvailable + SQLite Get',
            'base-red-check': 'Source.ListAvailable I/O',
            'base-red-block': 'SCM.Observe round trips',
            'snapshot': 'SQLite VM, ListRunEvents sort and JSON reflection',
            'worktree-remove': 'git subprocess spawn and worktree metadata',
            'run-watcher-fp': 'JSON.stringify character volume',
            'scm-observe': 'loopback PR + compare + checks + files round trips',
            'card-local-parse': 'yaml.Unmarshal + per-scope os.Stat',
            'http-snapshot-assembly': 'groupHistory + json reflection',
            'harness-spawn': 'loopback create + model POST + deferred move',
          };
          const workPlans = ['planner-select', 'prompt-build', 'mcp-journal',
            'redaction', 'wire-encode', 'tui-view', 'snapshot', 'worktree-remove',
            'run-watcher-fp', 'reconcile-tick-counts', 'base-red-check', 'base-red-block',
            'scm-observe', 'card-local-parse', 'http-snapshot-assembly', 'harness-spawn'];
          const errPlans = ['prompt-build', 'mcp-journal', 'redaction', 'wire-encode',
            'snapshot', 'worktree-remove', 'run-watcher-fp',
            'reconcile-tick-counts', 'base-red-check', 'base-red-block',
            'scm-observe', 'card-local-parse', 'http-snapshot-assembly', 'harness-spawn'];
          const durationMS = raw => {
            const n = Number.parseFloat(raw);
            if (raw.endsWith('ns')) return n / 1e6;
            if (raw.endsWith('µs') || raw.endsWith('us')) return n / 1e3;
            if (raw.endsWith('ms')) return n;
            return n * 1e3;
          };
          const values = { base: {}, head: {} };
          const ranges = { base: {}, head: {} };
          for (const side of ['base', 'head']) {
            for (const line of sides[side].split(/\r?\n/)) {
              const bench = line.match(/^Benchmark(\S+?)(?:-\d+)?\s+(\d+)\s+([\d.]+) ns\/op(.*)$/);
              if (bench) {
                const key = bench[1] === 'PlannerSelectInjectedChecker' ? 'planner-select'
                  : bench[1] === 'SpawnPrompt' ? 'prompt-build' : null;
                if (key) {
                  (values[side][key] ||= []).push(Number(bench[3]) / 1e6);
                  const allocs = bench[4].match(/([\d.]+)\s+B\/op/);
                  if (allocs) (values[side][`${key}-bytes`] ||= []).push(Number(allocs[1]));
                  const count = bench[4].match(/([\d.]+)\s+allocs\/op/);
                  if (count) (values[side][`${key}-allocs`] ||= []).push(Number(count[1]));
                  if (key === 'planner-select') {
                    const checks = bench[4].match(/([\d.]+)\s+checks-per-select/);
                    if (checks) (values[side]['planner-select-work'] ||= []).push(Number(checks[1]));
                  }
                }
                for (const metric of ['median-ns', 'work', 'errs']) {
                  // go test prints a custom metric as "<value> <name>".
                  const re = new RegExp(`([\\d.]+)\\s+(\\S+?)-${metric}(?=\\s|$)`, 'g');
                  let found;
                  while ((found = re.exec(bench[4])) !== null) {
                    const name = found[2];
                    if (!metricNames.includes(name)) continue;
                    const metricKey = metric === 'median-ns' ? name : `${name}-${metric}`;
                    const value = metric === 'median-ns' ? Number(found[1]) / 1e6 : Number(found[1]);
                    (values[side][metricKey] ||= []).push(value);
                  }
                }
                for (const metric of ['lists-per-tick', 'observes-per-tick', 'gets-per-tick']) {
                  const re = new RegExp(`([\\d.]+)\\s+(\\S+?)-${metric}(?=\\s|$)`, 'g');
                  let found;
                  while ((found = re.exec(bench[4])) !== null) {
                    if (!['reconcile-tick-counts', 'base-red-check', 'base-red-block'].includes(found[2])) continue;
                    (values[side][`${found[2]}-${metric}`] ||= []).push(Number(found[1]));
                  }
                }
                continue;
              }
              // The deep snapshot prints its own summary with a real min and
              // max, so its range is not inferred from the sampled medians.
              const snap = line.match(/^sqlite snapshot deep: median=(\S+) .* min=(\S+) max=(\S+) range=(\S+) work=(\d+) errs=(\d+)/);
              if (snap) ranges[side]['snapshot'] = [durationMS(snap[2]), durationMS(snap[3])];
              const wt = line.match(/^worktree-remove: median=([\d.]+)s range=([\d.]+)s-([\d.]+)s work=(\d+) status=(\d+) errs=(\d+)/);
              if (wt) {
                (values[side]['worktree-remove'] ||= []).push(Number(wt[1]));
                (values[side]['worktree-remove-work'] ||= []).push(Number(wt[4]));
                (values[side]['worktree-remove-status'] ||= []).push(Number(wt[5]));
                (values[side]['worktree-remove-errs'] ||= []).push(Number(wt[6]));
                ranges[side]['worktree-remove'] = [Number(wt[2]), Number(wt[3])];
              }
              const fp = line.match(/^run-watcher-fp: median ([\d.]+) ms, range ([\d.]+) to ([\d.]+) ms/);
              if (fp) {
                (values[side]['run-watcher-fp'] ||= []).push(Number(fp[1]));
                ranges[side]['run-watcher-fp'] = [Number(fp[2]), Number(fp[3])];
              }
              const fpChars = line.match(/^run-watcher-fp-chars: (\d+) characters, range (\d+) to (\d+)/);
              if (fpChars) {
                (values[side]['run-watcher-fp-chars'] ||= []).push(Number(fpChars[1]));
                ranges[side]['run-watcher-fp-chars'] = [Number(fpChars[2]), Number(fpChars[3])];
              }
              const fpWork = line.match(/^run-watcher-fp-work: snapshots=(\d+) normalizations=(\d+) emissions=(\d+)/);
              if (fpWork) {
                const snapshots = Number(fpWork[1]);
                const norms = Number(fpWork[2]);
                const emissions = Number(fpWork[3]);
                (values[side]['run-watcher-fp-work'] ||= []).push(snapshots + norms + emissions);
                (values[side]['run-watcher-fp-snapshots'] ||= []).push(snapshots);
                (values[side]['run-watcher-fp-normalizations'] ||= []).push(norms);
                (values[side]['run-watcher-fp-emissions'] ||= []).push(emissions);
              }
              const fpErrs = line.match(/^run-watcher-fp-errs: (\d+) errors/);
              if (fpErrs) (values[side]['run-watcher-fp-errs'] ||= []).push(Number(fpErrs[1]));
              const tui = line.match(/^production: median ([\d.]+) ms, range ([\d.]+) to ([\d.]+) ms/);
              if (tui) {
                (values[side]['tui-view'] ||= []).push(Number(tui[1]));
              }
              const counted = line.match(/^work counted in every round: (yes|NO)/);
              if (counted) (values[side]['tui-view-work'] ||= []).push(counted[1] === 'yes' ? 1 : 0);
            }
          }
          const median = xs => {
            const sorted = [...xs].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
          };
          const rows = [];
          for (const plan of wanted) {
            const keys = [plan];
            if (plan === 'planner-select' || plan === 'prompt-build') keys.push(`${plan}-bytes`, `${plan}-allocs`);
            if (workPlans.includes(plan)) keys.push(`${plan}-work`);
            if (errPlans.includes(plan)) keys.push(`${plan}-errs`);
            if (['reconcile-tick-counts', 'base-red-check', 'base-red-block'].includes(plan)) {
              keys.push(`${plan}-lists-per-tick`, `${plan}-observes-per-tick`, `${plan}-gets-per-tick`);
            }
            if (plan === 'worktree-remove') keys.push(`${plan}-status`);
            if (plan === 'run-watcher-fp') {
              keys.push(`${plan}-snapshots`, `${plan}-normalizations`, `${plan}-emissions`);
            }
            const wa = values.base[`${plan}-work`] || [];
            const wb = values.head[`${plan}-work`] || [];
            let workMismatch = !wa.length || !wb.length || median(wa) !== median(wb);
            // Worktree removal is expected to drop a git status call, so base
            // and head work counts differ by design.
            if (plan === 'worktree-remove') workMismatch = false;
            // The plugin fingerprint counts three work actions and errors;
            // all four must agree before a timing change is trusted.
            if (plan === 'run-watcher-fp') {
              workMismatch = ['snapshots', 'normalizations', 'emissions', 'errs'].some(counter => {
                const a = values.base[`${plan}-${counter}`] || [];
                const b = values.head[`${plan}-${counter}`] || [];
                return !a.length || !b.length || median(a) !== median(b);
              });
            }
            for (const key of keys) {
              const a = values.base[key] || [];
              const b = values.head[key] || [];
              if (!a.length || !b.length) continue;
              const am = median(a), bm = median(b);
              const amin = ranges.base[key] ? ranges.base[key][0] : Math.min(...a);
              const amax = ranges.base[key] ? ranges.base[key][1] : Math.max(...a);
              const bmin = ranges.head[key] ? ranges.head[key][0] : Math.min(...b);
              const bmax = ranges.head[key] ? ranges.head[key][1] : Math.max(...b);
              const delta = am === 0 ? 0 : 100 * (bm - am) / am;
              const overlap = amax >= bmin && bmax >= amin;
              let verdict = (overlap || workMismatch) ? 'inconclusive'
                : delta <= -2 ? 'gain' : delta >= 2 ? 'regression' : 'flat';
              // The worktree call row is judged by counts, not wall time.
              if (plan === 'worktree-remove' && key === 'worktree-remove-work') {
                const ba = values.base['worktree-remove-work'] || [];
                const bb = values.head['worktree-remove-work'] || [];
                const sa = values.base['worktree-remove-status'] || [];
                const sb = values.head['worktree-remove-status'] || [];
                const ea = values.base['worktree-remove-errs'] || [];
                const eb = values.head['worktree-remove-errs'] || [];
                if (median(ba) === 3 && median(sa) === 1 && median(bb) === 2 && median(sb) === 0
                  && median(ea) === 0 && median(eb) === 0) verdict = 'calls reduced';
              }
              const limiterKey = Object.keys(limiters)
                .filter(k => key.startsWith(k))
                .sort((a, b) => b.length - a.length)[0];
              rows.push(`| ${key} | ${am.toFixed(3)} | ${bm.toFixed(3)} | ${delta >= 0 ? '+' : ''}${delta.toFixed(2)}% | ${amin.toFixed(3)}-${amax.toFixed(3)} | ${bmin.toFixed(3)}-${bmax.toFixed(3)} | ${limiterKey ? limiters[limiterKey] : '-'} | ${verdict} |`);
            }
          }
          const marker = '<!-- beacon-pr-perf -->';
          const body = [
            marker,
            '### Advisory perf comparison, base vs head',
            '',
            'A B B A B A passes on two detached worktrees at the merge base and the real head SHA.',
            'Times are in ms; worktree-remove is in seconds and run-watcher-fp-chars counts characters.',
            'Work and errs are counts. Advisory data only: it adds no required check and does not gate merge.',
            '',
            '| plan / metric | base | head | delta | base range | head range | limiter | verdict |',
            '| --- | --- | --- | --- | --- | --- | --- | --- |',
            ...(rows.length ? rows : ['| no comparable rows | - | - | - | - | - | - | inconclusive |']),
            '',
            'Overlapping ranges or different work counts are inconclusive, not a gain.',
            status ? `Aborted passes: ${status.split(/\r?\n/).filter(Boolean).join(', ')}.` : 'No aborted passes.',
            'Raw logs and per-side CSVs are in the artifact.',
          ].join('\n');
          fs.mkdirSync('perf-results', { recursive: true });
          fs.writeFileSync('perf-results/comment.md', body + '\n');
          NODE

      - name: Upload comparison artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-compare-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            perf-results/
            ${{ runner.temp }}/perf-base.txt
            ${{ runner.temp }}/perf-head.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Post or update perf comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- beacon-pr-perf -->';
            const path = 'perf-results/comment.md';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : marker + '\n### Advisory perf comparison\n\nNo comparable rows; see the artifact.';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  perf-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, perf]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - name: Find the previous nightly run
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              event: 'schedule',
              status: 'success',
              per_page: 10,
            })
            const last = runs.find(run => run.id !== context.runId)
            core.setOutput('run_id', last ? String(last.id) : '')

      - name: Download the previous baseline
        id: baseline
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-baseline
          path: bench-baseline
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A missing baseline made the old job green by omission. Fail visibly.
      - name: Require a baseline
        if: steps.baseline.outcome != 'success'
        run: |
          echo "::error::Nightly baseline is missing; refusing a green run without a comparison."
          exit 1

      - name: Install benchstat
        if: steps.baseline.outcome == 'success'
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c

      - name: Measure current HEAD
        run: |
          mkdir -p bench-results
          go test -run '^$' -bench 'BenchmarkHotPaths|BenchmarkE2EOperatorPaths' \
            -benchtime=1x -count=10 ./internal/bench/ | tee bench-results/current.txt

      - name: Compare with benchstat
        id: compare
        if: steps.baseline.outcome == 'success'
        run: |
          benchstat="$(go env GOPATH)/bin/benchstat"
          "$benchstat" bench-baseline/current.txt bench-results/current.txt > bench-results/compare.txt
          "$benchstat" -format csv bench-baseline/current.txt bench-results/current.txt \
            > bench-results/compare.csv 2> bench-results/compare-warnings.txt
          # The 2 percent noise floor and the 15/20 percent limits live in the
          # script; it also rejects a baseline far above the recorded medians.
          bash scripts/check-bench-regression.sh bench-results/compare.csv

      - name: Full ten-plan suite on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/bench-e2e.sh --full

      - name: Upload benchstat artifacts
        if: steps.compare.outcome == 'success' || steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: benchstat-nightly-${{ github.run_number }}
          path: bench-results/
          retention-days: 30
          overwrite: true

      # The default success guard keeps a regressed run from moving the baseline.
      - name: Publish baseline for the next night
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench-results/current.txt
          overwrite: true
