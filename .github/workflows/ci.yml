name: ci

on:
  push:
    branches: [main, refactor/clean-core]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!AGENTS.md'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!AGENTS.md'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One shared filter feeds every gate. Output names are pinned here so a typo
  # in a consumer cannot silently turn into a skipped job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go-core: ${{ steps.all.outputs.go_core || steps.filter.outputs.go_core }}
      go-acp: ${{ steps.all.outputs.go_acp || steps.filter.outputs.go_acp }}
      go-opencode: ${{ steps.all.outputs.go_opencode || steps.filter.outputs.go_opencode }}
      go-tui: ${{ steps.all.outputs.go_tui || steps.filter.outputs.go_tui }}
      plugin: ${{ steps.all.outputs.plugin || steps.filter.outputs.plugin }}
      smoke: ${{ steps.all.outputs.smoke || steps.filter.outputs.smoke }}
      perf: ${{ steps.all.outputs.perf || steps.filter.outputs.perf }}
      shared: ${{ steps.all.outputs.shared || steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scheduled and manually started runs have no diff to filter. Every
      # output is true there so the nightly and the full suite always run.
      - name: Enable all paths for scheduled and manual runs
        id: all
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for key in go_core go_acp go_opencode go_tui plugin smoke perf shared; do
            echo "${key}=true" >> "$GITHUB_OUTPUT"
          done

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            go_core:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'arch_test.go'
              - 'go.mod'
              - 'go.sum'
            go_acp:
              - 'harnesses/acp/**'
            go_opencode:
              - 'harnesses/opencode/**'
            go_tui:
              - 'ui/tui/**'
            plugin:
              - '.opencode/plugins/beacon-project/**'
              - 'opencode.json'
              - 'scripts/plugin-tui-smoke.sh'
              - '.github/workflows/ci.yml'
            smoke:
              - 'scripts/bench-e2e.sh'
              - 'internal/bench/**'
              - '.github/workflows/ci.yml'
            perf:
              - 'scripts/check-bench-regression.sh'
              - 'internal/bench/**'
              - 'docs/perf/**'
              - '.github/workflows/ci.yml'
            shared:
              - 'AGENTS.md'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'

  mark-ready:
    # Ordinary PRs need no operator action to satisfy merge.labels.
    # Perf PRs are intentionally skipped: their worker sets the label after
    # the last variant has been measured.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Add ready-to-merge label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ready-to-merge'],
            })

  verify:
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs['go-core'] == 'true' ||
       needs.changes.outputs['go-acp'] == 'true' ||
       needs.changes.outputs['go-opencode'] == 'true' ||
       needs.changes.outputs['go-tui'] == 'true' ||
       needs.changes.outputs.plugin == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - name: Build root module
        run: go build ./...

      - name: Build ACP harness module
        working-directory: harnesses/acp
        run: go build ./...

      - name: Build OpenCode harness module
        working-directory: harnesses/opencode
        run: go build ./...

      - name: Build TUI module
        working-directory: ui/tui
        run: |
          go build ./...
          rm -f tui

      # Root govet runs once inside golangci-lint. The wrapper modules are
      # separate modules, so their vet steps stay explicit and acp joins them.
      - name: Vet ACP harness module
        working-directory: harnesses/acp
        run: go vet ./...

      - name: Vet OpenCode harness module
        working-directory: harnesses/opencode
        run: go vet ./...

      - name: Vet TUI module
        working-directory: ui/tui
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l cmd internal pkg harnesses ui arch_test.go)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15

      - name: Plugin syntax check
        run: |
          node --check .opencode/plugins/beacon-project/ui/ui_runtime.js
          node --check .opencode/plugins/beacon-project/ui/ui.js
          node --check .opencode/plugins/beacon-project/test_support/plugin_loader.js
          node --check .opencode/plugins/beacon-project/test_support/register_plugin_doubles.js

      - name: Plugin tests
        run: node --import ./.opencode/plugins/beacon-project/test_support/register_plugin_doubles.js --test ".opencode/plugins/beacon-project/**/*_test.js"

  build:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "build passed in verify"

  vet:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "vet passed in verify"

  lint:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "lint passed in verify"

  test-modules:
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs['go-core'] == 'true' ||
       needs.changes.outputs['go-acp'] == 'true' ||
       needs.changes.outputs['go-opencode'] == 'true' ||
       needs.changes.outputs['go-tui'] == 'true' ||
       needs.changes.outputs.smoke == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root command
            filter: go-core
            dir: .
            packages: ./cmd/...
            race: true
          - module: root app
            filter: go-core
            dir: .
            packages: ./internal/app/...
            race: true
          - module: root infra
            filter: go-core
            dir: .
            packages: ./internal/infra/...
            race: true
          - module: root bench
            filter: go-core
            dir: .
            packages: ./internal/bench/...
            race: true
            smoke: true
          - module: root dot
            filter: go-core
            dir: .
            packages: .
            race: false
            verbose: true
          - module: root core
            filter: go-core
            dir: .
            packages: ./pkg/...
            race: false
          - module: acp
            filter: go-acp
            dir: harnesses/acp
            packages: ./...
            race: false
          - module: opencode
            filter: go-opencode
            dir: harnesses/opencode
            packages: ./...
            race: true
          - module: tui
            filter: go-tui
            dir: ui/tui
            packages: ./...
            race: true
    steps:
      - uses: actions/checkout@v4

      # The module name joins the common dependency hash, so each leg restores
      # the cache it wrote instead of racing four other legs for one key.
      - name: Set per-leg cache key
        run: printf '%s\n' '${{ matrix.module }}' > ci-cache-key.txt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum
            ci-cache-key.txt

      - name: Test ${{ matrix.module }} module
        if: needs.changes.outputs.shared == 'true' || needs.changes.outputs[matrix.filter] == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          go test ${{ matrix.race && '-race' || '' }} ${{ matrix.verbose && '-v' || '' }} -shuffle=on ${{ matrix.packages }} 2>&1 | tee test-output.txt

      # Advisory annotations come from the same test run, not a second go test.
      - name: Advisory annotations
        if: matrix.module == 'root dot' && (needs.changes.outputs.shared == 'true' || needs.changes.outputs[matrix.filter] == 'true')
        run: |
          while IFS= read -r line; do
            case "$line" in
              *ADVISORY:*)
                message="${line#*ADVISORY:}"
                message="${message#"${message%%[![:space:]]*}"}"
                printf '::warning::%s\n' "$message"
                ;;
            esac
          done < test-output.txt

      # perf-smoke had no timing gate and recompiled the bench binary on a
      # fresh runner. It runs inside the root bench leg now. No timing gate is
      # added here: CI timing stays on the perf runner.
      - name: Bounded benchmark smoke
        if: matrix.smoke && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.smoke == 'true')
        run: timeout 30s bash scripts/bench-e2e.sh --smoke

  test:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: test-modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "all module suites passed"

  plugin-tui-smoke:
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.shared == 'true' || needs.changes.outputs.plugin == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache OpenCode CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-cli-${{ hashFiles('.opencode/plugins/beacon-project/supported-cli.json') }}

      - name: Add OpenCode CLI to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install the supported OpenCode CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          VERSION="$(node -p "require('./.opencode/plugins/beacon-project/supported-cli.json').cliVersion")"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VERSION" --no-modify-path

      - name: Boot OpenCode TUI with the Beacon plugin
        run: bash scripts/plugin-tui-smoke.sh

  perf-pr-advisory:
    # Two-tree, alternating comparison for a labeled PR. It never gates merge,
    # adds no required Criterion name, and always exits zero.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install benchstat
        continue-on-error: true
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c

      - name: Build two detached worktrees
        id: trees
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"
          git fetch origin "$BASE_REF" || true
          git fetch origin "$BASE_BRANCH" || true
          BASE="$(git merge-base "$BASE_REF" "$HEAD_REF")"
          # The comment parser takes its names and limiter text from the base
          # ref. A PR cannot rewrite those inputs, including on a fork.
          git show "$BASE_REF:docs/perf/bench-registry.json" \
            > "$RUNNER_TEMP/bench-registry.json"
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/perf-head" "$HEAD_REF"
          # Both trees must run the same known-good UI mirror. Take it from the
          # PR base branch: the labeled PR's own head can still carry the stale
          # mirror that aborts the pass. Write it into both worktrees before
          # the changed-file loop so the loop cannot replace it with head's.
          git show "origin/$BASE_BRANCH:internal/bench/ui_bench.js" \
            > "$RUNNER_TEMP/perf-base/internal/bench/ui_bench.js"
          git show "origin/$BASE_BRANCH:internal/bench/ui_bench.js" \
            > "$RUNNER_TEMP/perf-head/internal/bench/ui_bench.js"
          # Harness changes must be identical on both sides. Production code
          # stays at its own tree's revision, so plugin files are never copied.
          while IFS= read -r path; do
            case "$path" in
              internal/bench/ui_bench.js) continue ;;
              internal/bench/*|docs/perf/*|internal/infra/workspace/git_worktree_test.go|cmd/beacon/http_test.go|ui/tui/model_test.go|ui/tui/refresh_bench_test.go)
                if [[ -f "$RUNNER_TEMP/perf-head/$path" ]]; then
                  mkdir -p "$RUNNER_TEMP/perf-base/$(dirname "$path")"
                  cp "$RUNNER_TEMP/perf-head/$path" "$RUNNER_TEMP/perf-base/$path"
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD_REF")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # Both trees must measure the same harness. Hash every file that can
      # move a number: benchmark sources, fixtures, the registry, module pins,
      # the Node harnesses and the workspace latency test. Production code
      # stays at each tree's own revision, so it is deliberately not hashed.
      - name: Hash measurement files
        continue-on-error: true
        run: |
          set -euo pipefail
          hash_tree() {
            local dir="$1"
            (
              cd "$dir"
              {
                find internal/bench docs/perf -type f -print 2>/dev/null
                printf '%s\n' internal/infra/workspace/git_worktree_test.go \
                  go.mod go.sum go.work go.work.sum
                find . -type d -name testdata -prune -print 2>/dev/null \
                  | while IFS= read -r d; do find "$d" -type f -print; done
              } | LC_ALL=C sort -u | while IFS= read -r path; do
                  [[ -f "$path" ]] || continue
                  printf '%s ' "$path"
                  sha256sum "$path" | cut -d' ' -f1
                done | LC_ALL=C sort | sha256sum | cut -d' ' -f1
            )
          }
          base_hash="$(hash_tree "$RUNNER_TEMP/perf-base")"
          head_hash="$(hash_tree "$RUNNER_TEMP/perf-head")"
          printf 'base %s\nhead %s\n' "$base_hash" "$head_hash" > "$RUNNER_TEMP/perf-hash"
          if [[ "$base_hash" != "$head_hash" ]]; then
            echo "measurement trees differ" >> "$RUNNER_TEMP/perf-status"
          fi

      - name: Run five low-noise passes per side
        continue-on-error: true
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/perf-base.txt"
          : > "$RUNNER_TEMP/perf-head.txt"
          : > "$RUNNER_TEMP/perf-status"
          allowed="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          cpu="${allowed%%,*}"
          cpu="${cpu%%-*}"
          if [[ -z "$cpu" ]]; then
            echo "no allowed CPU in Cpus_allowed_list" >> "$RUNNER_TEMP/perf-status"
            cpu=0
          fi
          echo "pinned measurement CPU: $cpu"
          # Compile every measured package before the pinned passes. This
          # warmup writes no canonical row and is not counted as a pass.
          for tree in perf-base perf-head; do
            (cd "$RUNNER_TEMP/$tree" && go test -vet=off -run '^$' -bench '^$' ./internal/bench/) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/perf-status"
            (cd "$RUNNER_TEMP/$tree" && go test -vet=off -run '^$' ./internal/infra/workspace/) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/perf-status"
            (cd "$RUNNER_TEMP/$tree" && go test -vet=off -run '^$' -bench '^$' ./cmd/beacon/) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/perf-status"
            (cd "$RUNNER_TEMP/$tree/ui/tui" && go test -vet=off -run '^$' -bench '^$' ./) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/perf-status"
          done
          export BEACON_BENCH_CACHE=warm
          run_side() {
            local side="$1" dir="$2"
            {
              echo "== pass $side =="
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench 'BenchmarkReconcileTickCounts|BenchmarkBaseRedCheck|BenchmarkBaseRedBlockFanout' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkSQLiteSnapshot$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkPlannerSelectInjectedChecker$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkSpawnPrompt$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkHotPaths$' -benchtime=5x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkJSONControl$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" go test ./internal/infra/workspace/ -run '^TestGitWorktreeRemoveLatencyAlternating$' -count=1 -v) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BENCH_ITERATIONS=50 BENCH_WARMUP=0 node internal/bench/ui_bench.js) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BENCH_TICKS=1001 BENCH_ROUNDS=5 node internal/bench/run_watcher_bench.js) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkHTTPFramesEmission$' -benchtime=1x -count=1 -benchmem ./cmd/beacon/) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
              (cd "$dir/ui/tui" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkGoTUIView$' -benchtime=1x -count=1 -benchmem ./) \
                || echo "abort $side" >> "$RUNNER_TEMP/perf-status"
            } 2>&1 | tee -a "$RUNNER_TEMP/perf-$side.txt"
          }
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"

      - name: Write per-side CSV and comparison
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p perf-results
          benchstat="$(go env GOPATH)/bin/benchstat"
          "$benchstat" -format csv "$RUNNER_TEMP/perf-base.txt" > perf-results/base.csv
          "$benchstat" -format csv "$RUNNER_TEMP/perf-head.txt" > perf-results/head.csv
          "$benchstat" -format csv "$RUNNER_TEMP/perf-base.txt" "$RUNNER_TEMP/perf-head.txt" \
            > perf-results/compare.csv

      # The no-change control publishes the observed floor. A PR reads the most
      # recent one; a missing artifact leaves the registry default in place.
      - name: Find the calibrated noise floor
        id: floor
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const list = event => github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              event,
              status: 'success',
              per_page: 10,
            })
            const runs = [
              ...await list('schedule'),
              ...await list('workflow_dispatch'),
            ].filter(run => run.id !== context.runId)
             .sort((a, b) => b.id - a.id)
            const last = runs[0]
            core.setOutput('run_id', last ? String(last.id) : '')

      - name: Download calibrated noise floor
        if: steps.floor.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-noise-floor
          path: ${{ runner.temp }}/bench-noise-floor
          run-id: ${{ steps.floor.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # One comment per PR. A spread rule decides a verdict; the range relation
      # is supporting text only.
      - name: Build comparison comment
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const temp = process.env.RUNNER_TEMP;
          const prefix = 'beacon-perf: ';
          const fields = ['key', 'median_ms', 'min_ms', 'max_ms', 'work', 'errs', 'limiter', 'cache'];
          const controlKey = 'json-control';
          const notes = [];
          const maxFloorPct = 25;
          const allocDropPct = 5;

          const readLines = path => {
            try { return fs.readFileSync(path, 'utf8').split(/\r?\n/); }
            catch (e) { notes.push(`cannot read ${path}: ${e.message}`); return []; }
          };

          // benchstat writes one CSV table per metric. A config row and a
          // header row come first; the header puts the unit in column B and
          // "CI" in column C. With two inputs a data row is name, base center,
          // base CI, head center, head CI, delta, P.
          function readCompareCSV(path) {
            const metrics = new Map();
            let unit = '';
            for (const line of readLines(path)) {
              if (!line.trim()) continue;
              const cells = [];
              let field = '', quoted = false;
              for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                  if (quoted && line[i + 1] === '"') { field += '"'; i++; }
                  else quoted = !quoted;
                } else if (ch === ',' && !quoted) {
                  cells.push(field); field = '';
                } else field += ch;
              }
              cells.push(field);
              if (cells[0] === '') {
                unit = cells[2] === 'CI' ? cells[1] : '';
                continue;
              }
              if (!unit || cells[0] === 'geomean') continue;
              const old = Number.parseFloat(cells[1]);
              const next = Number.parseFloat(cells[3]);
              if (!Number.isFinite(old) || !Number.isFinite(next)) continue;
              if (!metrics.has(unit)) metrics.set(unit, new Map());
              metrics.get(unit).set(cells[0], { old, next });
            }
            return metrics;
          }

          // benchstat strips the Benchmark prefix but keeps a GOMAXPROCS
          // suffix and any slash-separated parameters.
          const benchNameMatches = (name, bench) => {
            const plain = name.replace(/-\d+$/, '');
            return plain === bench || plain.startsWith(`${bench}/`);
          };
          // Allocation counts are per benchmark, not per canonical key. Plans
          // with a dedicated benchmark map to it; the ten HotPaths plans share
          // the HotPaths row, which covers the whole pass. Other plans have no
          // Go allocation metric and leave the columns blank.
          const allocBench = {
            'snapshot': 'SQLiteSnapshot',
            'planner-select-injected-checker': 'PlannerSelectInjectedChecker',
            'dispatch-prompt': 'SpawnPrompt',
            'reconcile-tick-counts': 'ReconcileTickCounts',
            'json-control': 'JSONControl',
            'http-frame-emission': 'HTTPFramesEmission',
            'go-tui-view': 'GoTUIView',
          };
          const hotPathKeys = new Set([
            'sqlite-snapshot', 'card-parse', 'wire-encode', 'redaction',
            'mcp-journal', 'sse-fanout', 'scm-observe', 'card-local-parse',
            'http-snapshot-assembly', 'harness-spawn',
          ]);
          const findMetric = (metrics, unit, bench) => {
            const table = metrics.get(unit);
            if (!table) return null;
            for (const [name, value] of table) {
              if (benchNameMatches(name, bench)) return value;
            }
            return null;
          };
          const metricOf = (metrics, key, unit) => {
            const bench = allocBench[key] || (hotPathKeys.has(key) ? 'HotPaths' : '');
            return bench ? findMetric(metrics, unit, bench) : null;
          };
          const metricDelta = entry => entry && entry.old > 0
            ? 100 * (entry.next - entry.old) / entry.old : NaN;
          const fmtCount = x => Number.isFinite(x) ? x.toFixed(0) : '-';
          const fmtPct = x => Number.isFinite(x) ? `${x >= 0 ? '+' : ''}${x.toFixed(2)}%` : '-';

          const median = xs => {
            const s = [...xs].sort((a, b) => a - b);
            const mid = Math.floor(s.length / 2);
            return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
          };
          const fmt = (x, digits = 3) => Number.isFinite(x) ? x.toFixed(digits) : '-';

          // Names, limiter text and the noise policy come from the registry on
          // the base ref. A fork PR cannot rewrite these inputs.
          const registryPath = process.env.BENCH_REGISTRY || `${temp}/bench-registry.json`;
          let specs = [], noise = {};
          try {
            const doc = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
            if (!Array.isArray(doc.specs)) throw new Error('missing specs array');
            specs = doc.specs;
            noise = doc.noise || {};
          } catch (e) {
            notes.push(`cannot read registry: ${e.message}`);
          }
          const registry = new Map();
          for (const s of specs) {
            if (!s || typeof s.key !== 'string' || !s.key) continue;
            if (registry.has(s.key)) { notes.push(`duplicate registry key ${s.key}`); continue; }
            registry.set(s.key, s);
          }
          const defaultFloor = Number.isFinite(noise.defaultFloorPct) && noise.defaultFloorPct > 0
            ? noise.defaultFloorPct : 2;
          const minSamples = Number.isFinite(noise.minSamples) && noise.minSamples > 0
            ? noise.minSamples : 5;
          const quantile = Number.isFinite(noise.quantile) ? noise.quantile : 0.95;

          // The nightly no-change control publishes the observed floor. Use it
          // when available and say so when the comparison is uncalibrated.
          let floorPct = defaultFloor;
          let calibrated = false;
          let floors = null, rawFloors = null;
          try {
            const doc = JSON.parse(fs.readFileSync(`${temp}/bench-noise-floor/noise-floor.json`, 'utf8'));
            if (Number.isFinite(doc.floorPct) && doc.floorPct > 0) {
              const published = Math.max(defaultFloor, doc.floorPct);
              floorPct = Math.min(maxFloorPct, published);
              calibrated = true;
              if (published > maxFloorPct) {
                notes.push(`calibrated floor ${published}% clamped to ${maxFloorPct}% for verdicts`);
              }
            }
            if (Number.isFinite(doc.rawFloorPct) && doc.rawFloorPct > maxFloorPct) {
              notes.push(`raw observed floor ${doc.rawFloorPct}% clamped to ${maxFloorPct}% for verdicts`);
            }
            if (typeof doc.floorNote === 'string' && doc.floorNote) notes.push(doc.floorNote);
            if (doc.floors && typeof doc.floors === 'object' && !Array.isArray(doc.floors)) {
              floors = doc.floors;
            }
            if (doc.rawFloors && typeof doc.rawFloors === 'object' && !Array.isArray(doc.rawFloors)) {
              rawFloors = doc.rawFloors;
            }
          } catch (e) {
            notes.push(`noise floor uncalibrated; using registry default ${defaultFloor}%`);
          }

          // One canonical row per named plan per pass. Every failure is reported
          // in the comment; this advisory step still exits zero.
          function parseSide(path, side) {
            const passes = [];
            let pass = null;
            for (const line of readLines(path)) {
              const mark = line.match(/^== pass \S+ ==$/);
              if (mark) { pass = { rows: [], bad: [] }; passes.push(pass); continue; }
              if (!line.startsWith(prefix)) continue;
              let row;
              try { row = JSON.parse(line.slice(prefix.length)); }
              catch (e) { notes.push(`${side}: invalid canonical JSON: ${e.message}`); continue; }
              if (!row || typeof row !== 'object' || Array.isArray(row)) {
                notes.push(`${side}: canonical row is not an object`); continue;
              }
              const keys = Object.keys(row);
              if (keys.length !== fields.length || fields.some(f => !keys.includes(f))) {
                notes.push(`${side}: canonical row fields ${keys.join(',')}`); continue;
              }
              if (typeof row.key !== 'string' || !row.key ||
                  typeof row.limiter !== 'string' || !row.limiter ||
                  typeof row.cache !== 'string' || !row.cache) {
                notes.push(`${side}: canonical row has no key, limiter or cache`); continue;
              }
              if (['median_ms', 'min_ms', 'max_ms', 'work', 'errs'].some(f =>
                    typeof row[f] !== 'number' || !Number.isFinite(row[f]))) {
                notes.push(`${side}: non-finite number in ${row.key}`); continue;
              }
              if (row.min_ms <= 0 || row.max_ms < row.min_ms ||
                  row.median_ms < row.min_ms || row.median_ms > row.max_ms ||
                  row.work < 0 || row.errs < 0) {
                notes.push(`${side}: invalid values in ${row.key}`); continue;
              }
              if (!pass) { pass = { rows: [], bad: [] }; passes.push(pass); }
              // With -benchtime=5x testing.B emits a calibration row from run1
              // and a measured row from runN. Keep the later row, not both.
              const prior = pass.rows.findIndex(r => r.key === row.key);
              if (prior >= 0) { pass.rows[prior] = row; continue; }
              pass.rows.push(row);
            }
            return passes;
          }

          const basePasses = parseSide(`${temp}/perf-base.txt`, 'base');
          const headPasses = parseSide(`${temp}/perf-head.txt`, 'head');
          const allocMetrics = readCompareCSV('perf-results/compare.csv');
          const status = readLines(`${temp}/perf-status`).map(s => s.trim()).filter(Boolean);
          const hashes = readLines(`${temp}/perf-hash`);
          const sameHarness = hashes.length >= 2 &&
            hashes[0].split(/\s+/)[1] === hashes[1].split(/\s+/)[1];

          if (!basePasses.length || !headPasses.length) notes.push('missing pass markers');

          // The trusted base pass names the expected rows. Nightly-only keys
          // do not belong in a PR pass, and a head-only key has no counterpart.
          const expected = new Set();
          for (const p of basePasses) for (const r of p.rows) {
            const spec = registry.get(r.key);
            if (spec && spec.placement === 'nightly') continue;
            expected.add(r.key);
          }
          const extra = [];
          for (const p of headPasses) for (const r of p.rows) {
            if (!expected.has(r.key)) extra.push(r.key);
          }
          if (extra.length) notes.push(`rejected head-only keys: ${[...new Set(extra)].join(', ')}`);

          const unregistered = [...expected].filter(k => !registry.has(k));
          if (unregistered.length) {
            notes.push(`keys without a registry entry: ${unregistered.join(', ')}`);
          }

          let badShape = false;
          const missing = [];
          for (const [side, passes] of [['base', basePasses], ['head', headPasses]]) {
            if (passes.length !== 5) {
              notes.push(`${side} ran ${passes.length} passes, want 5`); badShape = true;
            }
            passes.forEach((p, i) => {
              if (p.rows.length !== expected.size) {
                notes.push(`${side} pass ${i + 1} has ${p.rows.length} rows, want ${expected.size}`);
                badShape = true;
              }
              for (const key of expected) {
                if (!p.rows.some(r => r.key === key)) missing.push(`${side} pass ${i + 1}: ${key}`);
              }
              if (p.bad.length) {
                notes.push(`${side} pass ${i + 1}: ${p.bad.join(', ')}`); badShape = true;
              }
            });
          }
          if (missing.length) notes.push(`missing rows: ${[...new Set(missing)].join(', ')}`);

          // Control drift decides only the ratio columns. The base, head,
          // delta, range, spread, work, errs and verdict columns use every
          // shape-valid pass, so a drifting control cannot erase raw rows or
          // force an inconclusive verdict.
          const controlOf = pass => pass.rows.find(r => r.key === controlKey);
          const allControl = [...basePasses, ...headPasses]
            .map(controlOf).filter(Boolean).map(r => r.median_ms);
          const controlRef = allControl.length ? median(allControl) : NaN;
          const ratioPasses = (side, passes) => passes.filter((pass, i) => {
            const c = controlOf(pass);
            if (!c) { notes.push(`${side} pass ${i + 1}: missing ${controlKey}`); return false; }
            if (!Number.isFinite(controlRef) || controlRef <= 0) return false;
            const drift = 100 * Math.abs(c.median_ms - controlRef) / controlRef;
            if (drift > floorPct) {
              notes.push(`${side} pass ${i + 1}: control drift ${drift.toFixed(2)}% exceeds ${floorPct}% floor`);
              return false;
            }
            return true;
          });
          const baseRatio = ratioPasses('base', basePasses);
          const headRatio = ratioPasses('head', headPasses);
          const ratiosUsable = baseRatio.length >= 2 && headRatio.length >= 2;
          if (!ratiosUsable) {
            notes.push('control drift left fewer than two passes on a side; ratio columns are -');
          }

          const inconclusiveAll = status.length > 0 || !sameHarness || badShape ||
            registry.size === 0 || extra.length > 0;

          const values = (passes, key, field) => passes
            .map(p => p.rows.find(r => r.key === key))
            .filter(Boolean).map(r => r[field]);
          const extreme = (passes, key, field, fn) => {
            const xs = values(passes, key, field);
            return xs.length ? fn(...xs) : NaN;
          };
          // Five medians per side, sorted s[0..4]. Drop exactly one extreme
          // from either end: min(s[3]-s[0], s[4]-s[1]). One spike cannot force
          // a false verdict while the rest of the spread still blocks one.
          const spread = xs => {
            const s = [...xs].sort((a, b) => a - b);
            const m = median(s);
            if (!s.length || !(m > 0)) return Infinity;
            if (s.length < 5) return 100 * (s[s.length - 1] - s[0]) / m;
            return 100 * Math.min(s[3] - s[0], s[4] - s[1]) / m;
          };
          const ratios = (passes, key) => passes.map(p => {
            const r = p.rows.find(x => x.key === key);
            const c = controlOf(p);
            return r && c && c.median_ms > 0 ? r.median_ms / c.median_ms : NaN;
          }).filter(Number.isFinite);

          const rows = [];
          const cacheStates = [...new Set([...basePasses, ...headPasses]
            .flatMap(p => p.rows.map(r => r.cache)))];
          for (const key of [...expected]) {
            const spec = registry.get(key);
            const baseRow = basePasses[0].rows.find(r => r.key === key);
            const limiter = (spec && spec.limiter) || (baseRow && baseRow.limiter) || '-';
            const cache = (baseRow && baseRow.cache) || '-';
            const a = values(basePasses, key, 'median_ms');
            const b = values(headPasses, key, 'median_ms');
            if (!a.length || !b.length) {
              rows.push(`| ${key} | - | - | - | - | - | - | - | - | - | - | - | - | - | - | - | ${limiter} | ${cache} | inconclusive |`);
              continue;
            }
            const am = median(a), bm = median(b);
            const amin = extreme(basePasses, key, 'min_ms', Math.min);
            const amax = extreme(basePasses, key, 'max_ms', Math.max);
            const bmin = extreme(headPasses, key, 'min_ms', Math.min);
            const bmax = extreme(headPasses, key, 'max_ms', Math.max);
            const wa = values(basePasses, key, 'work');
            const wb = values(headPasses, key, 'work');
            const ea = values(basePasses, key, 'errs');
            const eb = values(headPasses, key, 'errs');
            let workMismatch = !wa.length || !wb.length || median(wa) !== median(wb) ||
              !ea.length || !eb.length || median(ea) !== median(eb);
            // Worktree removal drops a git status call by design.
            if (key === 'worktree-remove') workMismatch = false;
            const overlap = amax >= bmin && bmax >= amin;
            const relation = overlap ? 'overlap' : 'separate';
            const delta = am === 0 ? 0 : 100 * (bm - am) / am;
            const maxSpread = Math.max(spread(a), spread(b));
            // A calibrated per-key floor wins for this row. Both the global
            // and per-key floors are capped so one outlier no-change run
            // cannot raise the verdict threshold above maxFloorPct.
            const rawPerKey = floors && Number.isFinite(floors[key]) && floors[key] > 0
              ? floors[key] : NaN;
            const unbounded = Number.isFinite(rawPerKey) && rawPerKey > 0
              ? rawPerKey
              : (Number.isFinite(floorPct) && floorPct > 0 ? floorPct : defaultFloor);
            const rowFloor = Math.min(maxFloorPct, unbounded);
            if (unbounded > maxFloorPct || (rawFloors && Number.isFinite(rawFloors[key]) &&
                rawFloors[key] > maxFloorPct)) {
              notes.push(`${key}: floor clamped to ${maxFloorPct}% for the verdict`);
            } else if (!Number.isFinite(rawPerKey)) {
              notes.push(`${key}: using uncalibrated floor ${rowFloor}%`);
            }
            const decisive = Math.abs(delta) >= rowFloor && Math.abs(delta) > maxSpread;
            const errsZero = ea.length > 0 && eb.length > 0 &&
              ea.every(v => v === 0) && eb.every(v => v === 0);
            const equalWork = wa.length > 0 && wb.length > 0 && median(wa) === median(wb);
            const noRise = delta <= rowFloor;
            const allocEntry = metricOf(allocMetrics, key, 'allocs/op');
            const bytesEntry = metricOf(allocMetrics, key, 'B/op');
            const allocDelta = metricDelta(allocEntry);
            const bytesDelta = metricDelta(bytesEntry);
            const allocGain = errsZero && noRise && equalWork &&
              ((Number.isFinite(allocDelta) && allocDelta <= -allocDropPct) ||
               (Number.isFinite(bytesDelta) && bytesDelta <= -allocDropPct));
            const callsReduced = key === 'worktree-remove' && errsZero && noRise &&
              median(wa) === 3 && median(wb) === 2;
            const counterFalls = key.startsWith('reconcile-') && errsZero && noRise &&
              equalWork && ['lists-per-tick', 'observes-per-tick', 'gets-per-tick']
                .some(suffix => {
                  const bench = allocBench[key] || 'ReconcileTickCounts';
                  for (const [unit, table] of allocMetrics) {
                    if (!unit.endsWith(`-${suffix}`)) continue;
                    for (const [name, value] of table) {
                      if (benchNameMatches(name, bench) && value.next < value.old) return true;
                    }
                  }
                  return false;
                });
            let verdict;
            if (workMismatch || inconclusiveAll || !registry.has(key)) {
              verdict = 'inconclusive';
            } else if (decisive) {
              verdict = delta <= -rowFloor ? 'gain' : 'regression';
            } else if (allocGain) {
              verdict = 'gain (allocs/bytes)';
            } else if (callsReduced || counterFalls) {
              verdict = 'gain (calls reduced)';
            } else {
              verdict = 'flat';
            }
            const ra = ratiosUsable ? median(ratios(baseRatio, key)) : NaN;
            const rb = ratiosUsable ? median(ratios(headRatio, key)) : NaN;
            const ratioDelta = Number.isFinite(ra) && ra !== 0 && Number.isFinite(rb)
              ? 100 * (rb - ra) / ra : NaN;
            rows.push(`| ${key} | ${am.toFixed(3)} | ${bm.toFixed(3)} | ${fmtPct(delta)} | ${amin.toFixed(3)}-${amax.toFixed(3)} | ${bmin.toFixed(3)}-${bmax.toFixed(3)} | ${relation} | ${fmt(ra)} | ${fmt(rb)} | ${fmt(ratioDelta, 2)}% | ${fmtCount(allocEntry && allocEntry.old)} | ${fmtCount(allocEntry && allocEntry.next)} | ${fmtPct(allocDelta)} | ${fmtCount(bytesEntry && bytesEntry.old)} | ${fmtCount(bytesEntry && bytesEntry.next)} | ${fmtPct(bytesDelta)} | ${limiter} | ${cache} | ${verdict} |`);
          }

          const marker = '<!-- beacon-pr-perf -->';
          const body = [
            marker,
            '### Advisory perf comparison, base vs head',
            '',
            'Five alternating passes per side (B A A B B A A B B A) on two detached worktrees at the merge base and the real head SHA.',
            'One uncounted compile-only warmup per tree compiles the bench and workspace packages before the passes; measurement runs on one CPU from Cpus_allowed_list via taskset.',
            'Canonical rows come from the harness output; names, limiter text and the noise floor come from the registry on the base ref.',
            `Noise floor ${floorPct}% (${calibrated ? 'calibrated by the no-change control' : 'uncalibrated, registry default'}); policy: ${minSamples} samples at quantile ${quantile}. Verdict floors are capped at ${maxFloorPct}%.`,
            'Times are in ms. Work and errs are counts. Ratios divide each plan by the pure json-control row in the same pass.',
            'Allocation and counter columns come from perf-results/compare.csv. Go benchmarks report them at benchmark granularity, so the ten HotPaths plans share the HotPaths row.',
            'Advisory data only: it adds no required check and does not gate merge.',
            '',
            '| plan / metric | base | head | delta | base range | head range | range relation | base/control | head/control | ratio delta | allocs/op base | allocs/op head | allocs/op delta | B/op base | B/op head | B/op delta | limiter | cache | verdict |',
            '| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |',
            ...(rows.length ? rows : ['| no comparable rows | - | - | - | - | - | - | - | - | - | - | - | - | - | - | - | - | - | inconclusive |']),
            '',
            ...(notes.length ? ['Parser notes:', '', ...notes.map(n => `- ${n}`), ''] : []),
            `A timing verdict needs an absolute delta of at least ${floorPct}% and greater than the larger trimmed within-side spread; otherwise the row is flat.`,
            `A flat row becomes 'gain (allocs/bytes)' when allocs/op or B/op falls at least ${allocDropPct}% with equal work, zero errors and no median rise beyond the row floor. Worktree removal with work 3 to 2, and reconcile keys with a falling deterministic counter, become 'gain (calls reduced)' under the same error and rise limits.`,
            'Spread drops one extreme sample from either end of five medians per side, using min(s[3]-s[0], s[4]-s[1]), so a single spike does not force a false verdict. Range relation is supporting text only.',
            `Cache states recorded from canonical rows: ${cacheStates.join(', ') || '-'}.`,
            status.length ? `Aborted passes: ${status.join(', ')}.` : 'No aborted passes.',
            'Raw logs and per-side CSVs are in the artifact.',
          ].join('\n');
          fs.mkdirSync('perf-results', { recursive: true });
          fs.writeFileSync('perf-results/comment.md', body + '\n');
          NODE

      - name: Upload comparison artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-compare-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            perf-results/
            ${{ runner.temp }}/perf-base.txt
            ${{ runner.temp }}/perf-head.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Post or update perf comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- beacon-pr-perf -->';
            const path = 'perf-results/comment.md';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : marker + '\n### Advisory perf comparison\n\nNo comparable rows; see the artifact.';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Both trees are the same SHA here, so every observed delta is machine noise.
  # The published floor lets PR comments reject a false regression.
  perf-noise-floor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out one SHA as both trees
        id: trees
        continue-on-error: true
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$SHA"
          git worktree add --detach "$RUNNER_TEMP/perf-head" "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Run five no-change passes per side
        continue-on-error: true
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/perf-base.txt"
          : > "$RUNNER_TEMP/perf-head.txt"
          : > "$RUNNER_TEMP/floor-status"
          allowed="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          cpu="${allowed%%,*}"
          cpu="${cpu%%-*}"
          if [[ -z "$cpu" ]]; then
            echo "no allowed CPU in Cpus_allowed_list" >> "$RUNNER_TEMP/floor-status"
            cpu=0
          fi
          echo "pinned measurement CPU: $cpu"
          for tree in perf-base perf-head; do
            (cd "$RUNNER_TEMP/$tree" && go test -vet=off -run '^$' -bench '^$' ./internal/bench/) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/floor-status"
            (cd "$RUNNER_TEMP/$tree" && go test -vet=off -run '^$' ./internal/infra/workspace/) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/floor-status"
            (cd "$RUNNER_TEMP/$tree" && go test -vet=off -run '^$' -bench '^$' ./cmd/beacon/) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/floor-status"
            (cd "$RUNNER_TEMP/$tree/ui/tui" && go test -vet=off -run '^$' -bench '^$' ./) \
              || echo "warmup $tree" >> "$RUNNER_TEMP/floor-status"
          done
          export BEACON_BENCH_CACHE=warm
          run_side() {
            local side="$1" dir="$2"
            {
              echo "== pass $side =="
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench 'BenchmarkReconcileTickCounts|BenchmarkBaseRedCheck|BenchmarkBaseRedBlockFanout' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkSQLiteSnapshot$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkPlannerSelectInjectedChecker$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkSpawnPrompt$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkHotPaths$' -benchtime=5x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkJSONControl$' -benchtime=1x -count=1 -benchmem ./internal/bench/) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" go test ./internal/infra/workspace/ -run '^TestGitWorktreeRemoveLatencyAlternating$' -count=1 -v) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BENCH_ITERATIONS=50 BENCH_WARMUP=0 node internal/bench/ui_bench.js) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BENCH_TICKS=1001 BENCH_ROUNDS=5 node internal/bench/run_watcher_bench.js) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkHTTPFramesEmission$' -benchtime=1x -count=1 -benchmem ./cmd/beacon/) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
              (cd "$dir/ui/tui" && taskset -c "$cpu" env BEACON_BENCH_SMOKE=1 go test -vet=off -run '^$' \
                -bench '^BenchmarkGoTUIView$' -benchtime=1x -count=1 -benchmem ./) \
                || echo "abort $side" >> "$RUNNER_TEMP/floor-status"
            } 2>&1 | tee -a "$RUNNER_TEMP/perf-$side.txt"
          }
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"
          run_side base "$RUNNER_TEMP/perf-base"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side head "$RUNNER_TEMP/perf-head"
          run_side base "$RUNNER_TEMP/perf-base"

      - name: Calibrate the noise floor
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const temp = process.env.RUNNER_TEMP;
          const prefix = 'beacon-perf: ';
          const fields = ['key', 'median_ms', 'min_ms', 'max_ms', 'work', 'errs', 'limiter', 'cache'];
          const maxFloorPct = 25;
          // Every published floor is at least the registry default.
          let defaultFloor = 2;
          try {
            const reg = JSON.parse(fs.readFileSync('docs/perf/bench-registry.json', 'utf8'));
            const d = reg.noise && reg.noise.defaultFloorPct;
            if (Number.isFinite(d) && d > 0) defaultFloor = d;
          } catch (e) {
            // The 2 percent fallback matches the registry default.
          }
          const median = xs => {
            const s = [...xs].sort((a, b) => a - b);
            const mid = Math.floor(s.length / 2);
            return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
          };
          const side = name => {
            const out = new Map();
            for (const line of fs.readFileSync(`${temp}/perf-${name}.txt`, 'utf8').split(/\r?\n/)) {
              if (!line.startsWith(prefix)) continue;
              let row;
              try { row = JSON.parse(line.slice(prefix.length)); } catch (e) { continue; }
              if (!row || fields.some(f => !(f in row))) continue;
              if (!out.has(row.key)) out.set(row.key, []);
              out.get(row.key).push(row.median_ms);
            }
            const med = new Map();
            for (const [key, values] of out) med.set(key, median(values));
            return med;
          };
          const base = side('base'), head = side('head');
          const deltas = [];
          for (const [key, a] of base) {
            const b = head.get(key);
            if (Number.isFinite(a) && Number.isFinite(b) && a > 0) {
              deltas.push(Math.abs(100 * (b - a) / a));
            }
          }
          deltas.sort((a, b) => a - b);
          const index = Math.min(deltas.length - 1, Math.ceil(0.95 * deltas.length) - 1);
          const observed = deltas.length ? deltas[Math.max(0, index)] : 0;
          const rawFloorPct = Math.max(defaultFloor, Math.ceil(observed * 10) / 10);
          // A single noisy run must not raise the verdict floor above the cap.
          // The raw value stays in the artifact for diagnosis.
          const floorPct = Math.min(maxFloorPct, rawFloorPct);
          const floorNote = rawFloorPct > maxFloorPct
            ? `raw floor ${rawFloorPct}% clamped to ${maxFloorPct}% for verdicts`
            : '';

          // Per-key floors come from the same no-change passes. Pair the
          // medians by pass index and keep the later row for a 5x duplicate.
          const toPasses = name => {
            const out = [];
            let pass = null;
            for (const line of fs.readFileSync(`${temp}/perf-${name}.txt`, 'utf8').split(/\r?\n/)) {
              if (/^== pass \S+ ==$/.test(line)) { pass = new Map(); out.push(pass); continue; }
              if (!line.startsWith(prefix)) continue;
              let row;
              try { row = JSON.parse(line.slice(prefix.length)); } catch (e) { continue; }
              if (!row || fields.some(f => !(f in row))) continue;
              if (!pass) { pass = new Map(); out.push(pass); }
              pass.set(row.key, row);
            }
            return out;
          };
          const quantile95 = xs => {
            if (!xs.length) return 0;
            const s = [...xs].sort((a, b) => a - b);
            const index = Math.min(s.length - 1, Math.ceil(0.95 * s.length) - 1);
            return s[Math.max(0, index)];
          };
          const floors = {}, rawFloors = {};
          const baseByPass = toPasses('base'), headByPass = toPasses('head');
          const keys = new Set();
          for (const p of [...baseByPass, ...headByPass]) for (const k of p.keys()) keys.add(k);
          for (const key of keys) {
            const perPass = [];
            const count = Math.min(baseByPass.length, headByPass.length);
            for (let i = 0; i < count; i++) {
              const a = baseByPass[i].get(key), b = headByPass[i].get(key);
              if (a && b && Number.isFinite(a.median_ms) && Number.isFinite(b.median_ms) && a.median_ms > 0) {
                perPass.push(Math.abs(100 * (b.median_ms - a.median_ms) / a.median_ms));
              }
            }
            const raw = Math.max(defaultFloor, Math.ceil(quantile95(perPass) * 10) / 10);
            rawFloors[key] = raw;
            floors[key] = Math.min(maxFloorPct, raw);
          }
          const doc = {
            floorPct,
            rawFloorPct,
            floorNote,
            floors,
            rawFloors,
            samples: deltas.length,
            quantile: 0.95,
            sha: process.env.GITHUB_SHA,
            source: 'no-change-control',
          };
          fs.writeFileSync(`${temp}/noise-floor.json`, JSON.stringify(doc, null, 2) + '\n');
          console.log(`calibrated noise floor ${floorPct}% (raw ${rawFloorPct}%) from ${deltas.length} plans`);
          NODE

      - name: Publish bench-noise-floor
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bench-noise-floor
          path: ${{ runner.temp }}/noise-floor.json
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

  perf-nightly:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, x64, perf]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/tui/go.sum

      - name: Find the previous nightly run
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              event: 'schedule',
              status: 'success',
              per_page: 10,
            })
            const last = runs.find(run => run.id !== context.runId)
            core.setOutput('run_id', last ? String(last.id) : '')

      - name: Download the previous baseline
        id: baseline
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-baseline
          path: bench-baseline
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A missing baseline made the old job green by omission. Fail visibly.
      - name: Require a baseline
        if: steps.baseline.outcome != 'success'
        run: |
          echo "::error::Nightly baseline is missing; refusing a green run without a comparison."
          exit 1

      - name: Install benchstat
        if: steps.baseline.outcome == 'success'
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c

      - name: Measure current HEAD
        run: |
          mkdir -p bench-results
          go test -run '^$' -bench 'BenchmarkHotPaths|BenchmarkE2EOperatorPaths' \
            -benchtime=1x -count=10 ./internal/bench/ | tee bench-results/current.txt

      - name: Compare with benchstat
        id: compare
        if: steps.baseline.outcome == 'success'
        run: |
          benchstat="$(go env GOPATH)/bin/benchstat"
          "$benchstat" bench-baseline/current.txt bench-results/current.txt > bench-results/compare.txt
          "$benchstat" -format csv bench-baseline/current.txt bench-results/current.txt \
            > bench-results/compare.csv 2> bench-results/compare-warnings.txt
          # The 2 percent noise floor and the 15/20 percent limits live in the
          # script; it also rejects a baseline far above the recorded medians.
          bash scripts/check-bench-regression.sh bench-results/compare.csv

      - name: Full ten-plan suite on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/bench-e2e.sh --full

      - name: Upload benchstat artifacts
        if: steps.compare.outcome == 'success' || steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: benchstat-nightly-${{ github.run_number }}
          path: bench-results/
          retention-days: 30
          overwrite: true

      # The default success guard keeps a regressed run from moving the baseline.
      - name: Publish baseline for the next night
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench-results/current.txt
          overwrite: true
