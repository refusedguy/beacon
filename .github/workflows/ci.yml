name: ci

on:
  push:
    branches: [main, refactor/clean-core]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l cmd internal pkg harnesses ui arch_test.go)"

      - name: Core checks
        run: |
          go test ./...
          go vet ./...
          go build ./...

      - name: OpenCode harness module
        working-directory: harnesses/opencode
        run: |
          go test ./...
          go vet ./...
          go build ./...

      - name: TUI module
        working-directory: ui/tui
        run: |
          go test ./...
          go vet ./...
          go build ./...
          rm -f tui
