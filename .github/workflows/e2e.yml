name: E2E

# ATX-23. e2e вынесен из критического пути CI: ночной прогон, ручной запуск
# и PR, меняющие сценарии e2e или код, который они проверяют. Обычный PR
# e2e не ждёт. continue-on-error оставляет проверку необязательной для merge,
# но результат виден в Actions и в списке проверок затронутого PR.
on:
  schedule:
    # 03:17 UTC каждый день: регулярное покрытие без участия PR.
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/e2e/**'
      - 'tests/scenarios/**'
      - 'internal/domain/**'
      - 'internal/infra/mcp/**'
      - 'internal/infra/store/**'
      - '.opencode/plugins/**'
      - 'cmd/beacon/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

# Для PR новый push отменяет устаревший прогон, как в ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Замер: медиана 90 с, максимум 104 с. Пять минут запирают зависший
    # прогон, не обрезая ни один из восьми живых сценариев.
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'

      # npm-пакет opencode-ai 2.3.0 не существует, а @opencode/cli 2.3.0
      # требует postinstall, который npm 12 блокирует. Прямое извлечение
      # бинарника из платформенного tarball проверено локально: opencode v2.3.0.
      - name: Install opencode 2.3.0
        shell: bash
        run: |
          set -euo pipefail
          version=2.3.0
          work="$RUNNER_TEMP/opencode-install"
          mkdir -p "$work" "$HOME/.opencode/bin"
          curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-${version}.tgz" \
            -o "$work/opencode.tgz"
          tar -xzf "$work/opencode.tgz" -C "$work"
          cp "$work/package/bin/opencode" "$HOME/.opencode/bin/opencode"
          chmod 755 "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Run e2e
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          bash tests/e2e/run.sh
