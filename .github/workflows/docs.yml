name: Docs

# Отдельный markdown/docs gate. Проверяет статус, структуру карточек и дубли
# номеров ADR. Gate обязательный: красная проверка блокирует merge.
# Действующие исключения лежат в gate/config/docs-baseline.json.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'
      - 'tools/beacon-gates/gate/**'
      - 'tools/beacon-gates/docsgate/**'

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/go-runner-setup
        with:
          cache: 'false'

      # BL-05. docsgate - отдельный main package, не входит в бинарник
      # beacon-gates. Проверка запускает его через go run ./docsgate.
      - name: Self-test docs gate on planted bad input
        working-directory: tools/beacon-gates
        shell: bash
        run: |
          set -euo pipefail
          go run ./docsgate --self-test

      - name: Check docs status, structure and revisions
        working-directory: tools/beacon-gates
        shell: bash
        run: |
          set -euo pipefail
          go run ./docsgate -root ../.. -baseline gate/config/docs-baseline.json
