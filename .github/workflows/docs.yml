name: Docs

# Отдельный markdown/docs gate. Проверяет статус, структуру карточек и дубли
# номеров ADR. Gate обязательный: красная проверка блокирует merge.
# Действующие исключения лежат в gate/config/docs-baseline.json.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'
      - 'tools/beacon-gates/gate/**'
      - 'tools/beacon-gates/docsgate/**'
      - 'cmd/beacon/**'

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/go-runner-setup
        with:
          cache: 'false'

      # BL-05. docsgate - отдельный main package, не входит в бинарник
      # beacon-gates. Проверка запускает его через go run ./docsgate.
      - name: Self-test docs gate on planted bad input
        working-directory: tools/beacon-gates
        shell: bash
        run: |
          set -euo pipefail
          go run ./docsgate --self-test

      - name: Check docs status, structure and revisions
        working-directory: tools/beacon-gates
        shell: bash
        run: |
          set -euo pipefail
          go run ./docsgate -root ../.. -baseline gate/config/docs-baseline.json

      # TCG-17. README command table is generated from catalog.go; a change to
      # a command summary or flag usage without a matching README edit fails.
      - name: Check README command table matches catalog
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/beacon list --markdown > /tmp/beacon-commands.md
          awk '/<!-- BEGIN COMMANDS -->/{inside=1; next} /<!-- END COMMANDS -->/{inside=0} inside' README.md > /tmp/readme-commands.md
          diff -u /tmp/readme-commands.md /tmp/beacon-commands.md
