name: Gates binary

# Закоммиченный tools/beacon-gates/beacon-gates обязан совпадать со сборкой
# из исходников. Пересобираем теми же флагами и сравниваем байты.
on:
  push:
    branches: [main]
    paths: ['tools/beacon-gates/**', 'go.mod', '.github/workflows/gates-binary.yml']
  pull_request:
    paths: ['tools/beacon-gates/**', 'go.mod', '.github/workflows/gates-binary.yml']
  # Ручной обход path-фильтра: запускает проверку независимо от изменённых файлов.
  workflow_dispatch:

permissions:
  # PR-ветке нужен write, чтобы закоммитить пересобранный бинарник.
  contents: write

jobs:
  gates-binary:
    name: gates-binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # На PR берём HEAD ветки: сюда же коммитим пересобранный бинарник.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: ./.github/actions/go-runner-setup
        with:
          cache: 'true'

      - name: Rebuild gates from source
        shell: bash
        run: |
          set -euo pipefail
          cd tools/beacon-gates
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-buildid= -s -w" \
            -o "$RUNNER_TEMP/beacon-gates-built" .

      - name: Report Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          printf 'go version: %s\n' "$(go version)"
          printf 'go env GOTOOLCHAIN=%s GOEXPERIMENT=%s GOVERSION=%s\n' \
            "$(go env GOTOOLCHAIN)" "$(go env GOEXPERIMENT)" "$(go env GOVERSION)"
          printf 'go.mod go=%s\n' "$(go list -m -f '{{.GoVersion}}')"

      - name: Compare committed and rebuilt bytes
        id: compare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          committed=tools/beacon-gates/beacon-gates
          rebuilt="$RUNNER_TEMP/beacon-gates-built"
          if [ ! -f "$committed" ]; then
            printf 'missing committed gates binary: %s\n' "$committed" >&2
            exit 1
          fi
          printf 'sha256 committed=%s\n' "$(sha256sum "$committed" | cut -d' ' -f1)"
          printf 'sha256 rebuilt=%s\n' "$(sha256sum "$rebuilt" | cut -d' ' -f1)"
          if cmp -s "$committed" "$rebuilt"; then
            printf 'gates binary matches source\n'
            printf 'mismatch=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'gates binary differs from source\n' >&2
            printf 'mismatch=true\n' >> "$GITHUB_OUTPUT"
            mod_version="$(go list -m -f '{{.GoVersion}}')"
            runner_version="$(go env GOVERSION)"
            runner_version="${runner_version#go}"
            if [ "$mod_version" != "$runner_version" ]; then
              printf 'toolchain mismatch: go.mod=%s runner=%s\n' "$mod_version" "$runner_version" >&2
            fi
            # На PR бинарник догоняет исходники коммитом в ветку. На main
            # расхождение остаётся ошибкой: туда workflow не пишет.
            if [ "$EVENT_NAME" != "pull_request" ] || [ "$PR_HEAD_REPO" != "$REPO" ]; then
              printf 'rebuild: cd tools/beacon-gates && CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-buildid= -s -w" -o beacon-gates .\n' >&2
              exit 1
            fi
          fi

      - name: Commit rebuilt gates binary to PR branch
        if: steps.compare.outputs.mismatch == 'true'
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/beacon-gates-built" tools/beacon-gates/beacon-gates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/beacon-gates/beacon-gates
          if git diff --cached --quiet; then
            printf 'gates binary already up to date\n'
            exit 0
          fi
          git commit -m "chore(gates): rebuild committed binary with pinned Go toolchain"
          git push origin "HEAD:$PR_HEAD_REF"
