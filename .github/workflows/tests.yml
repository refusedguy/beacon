name: Registry check

# T5.63. Проверка схемы реестра в CI по ADR 0022. Отдельный workflow, чтобы не
# менять существующие гейты в ci.yml. Позитивный прогон читает тестовый конфиг
# из tools/beacon-gates/gate/config/registry.json. Негативный конфиг пишется во
# временный каталог runner и обязан завершиться кодом 1.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'worktrees/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'worktrees/**']

permissions:
  contents: read

# BL-03. Те же флаги сборки beacon, что и в ci.yml. Шаг сборки ссылается на
# общее определение и не повторяет строку флагов.
env:
  BEACON_BUILD_FLAGS: '-trimpath -buildvcs=false'
  BEACON_BUILD_LDFLAGS: '-buildid= -s -w'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry-check:
    name: registry-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/go-runner-setup

      # BL-04. Три модуля обязаны требовать одну версию Go. Расхождение
      # ловится здесь, а не при сборке гейтов или eval-раннера.
      - name: Go directives match across modules
        shell: bash
        run: |
          set -euo pipefail
          root_go=$(awk '$1 == "go" { print $2; exit }' go.mod)
          gates_go=$(awk '$1 == "go" { print $2; exit }' tools/beacon-gates/go.mod)
          evals_go=$(awk '$1 == "go" { print $2; exit }' evals/go.mod)
          printf 'go directives: root=%s gates=%s evals=%s\n' \
            "$root_go" "$gates_go" "$evals_go"
          if [ -z "$root_go" ] || [ -z "$gates_go" ] || [ -z "$evals_go" ]; then
            printf 'missing go directive in one of the modules\n' >&2
            exit 1
          fi
          if [ "$root_go" != "$gates_go" ] || [ "$root_go" != "$evals_go" ]; then
            printf 'go directive mismatch: root=%s gates=%s evals=%s\n' \
              "$root_go" "$gates_go" "$evals_go" >&2
            exit 1
          fi

      # BL-04. Модуль evals не входит в корневой ./... и имеет build tag eval.
      # Отдельный шаг делает его тест обязательной проверкой PR.
      # evals заменяет родительский модуль через replace, поэтому eval-тесты
      # собирают внутренние пакеты, которым нужны lumberjack.v2 и yaml.v3.
      # Их сумм нет в evals/go.sum, и -mod=mod даёт go добавить их при прогоне.
      - name: Test evals module
        working-directory: evals
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=mod -tags=eval ./...

      # EM-01. go test собирает только тесты и не вызывает main() из
      # evals/main.go. Табличный раннер регистрирует 50 именованных кейсов
      # и печатает итог вида "50 passed, 1 warning, 0 failed". Шаг гонит
      # раннер и требует нулевое число failed, чтобы регрессия блокировала PR.
      - name: Run eval suite
        working-directory: evals
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/eval-suite.log"
          # Раннер берёт корень репозитория и собирает evalserver командой
          # GO build ./cmd/evalserver из этого корня. Пакет лежит в
          # evals/cmd/evalserver, поэтому прямой путь из корня не находится.
          # Обёртка меняет каталог только на дочернюю сборку сервера.
          # Остальные пути раннера остаются корневыми.
          go_wrapper="$RUNNER_TEMP/eval-go"
          cat > "$go_wrapper" <<'EOF'
          #!/usr/bin/env bash
          cd "$EVALS_MODULE_DIR" || exit 1
          exec go "$@"
          EOF
          chmod +x "$go_wrapper"
          export EVALS_MODULE_DIR="$PWD"
          GO="$go_wrapper" GOPROXY=off go run -tags=eval . 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            printf 'eval suite exit=%d\n' "$code" >&2
            exit "$code"
          fi
          summary=$(grep -E '^[0-9]+ passed, [0-9]+ warning, [0-9]+ failed$' "$log" | tail -n 1)
          if [ -z "$summary" ]; then
            printf 'eval suite summary line missing\n' >&2
            exit 1
          fi
          printf 'eval suite summary: %s\n' "$summary"
          passed=$(printf '%s\n' "$summary" | sed -E 's/^([0-9]+) passed.*/\1/')
          failed=$(printf '%s\n' "$summary" | sed -E 's/.* ([0-9]+) failed$/\1/')
          if [ "$failed" -ne 0 ]; then
            printf 'eval suite failed=%s: %s\n' "$failed" "$summary" >&2
            exit 1
          fi
          if [ "$passed" -lt 50 ]; then
            printf 'eval suite passed=%s, want at least 50: %s\n' "$passed" "$summary" >&2
            exit 1
          fi

      # WIRING-1680. Раннер EM-02 пишет отчёт в tmp/eval-results.json в корне
      # репозитория. Шаг публикует файл как артефакт, чтобы его можно было
      # скачать из Actions. Путь указан от корня checkout, а не от evals.
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tmp/eval-results.json
          if-no-files-found: error

      - name: Build beacon
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build $BEACON_BUILD_FLAGS \
            -ldflags="$BEACON_BUILD_LDFLAGS" \
            -o beacon ./cmd/beacon
          beacon_sha=$(sha256sum beacon | cut -d' ' -f1)
          printf 'build ok binary=beacon sha256=%s\n' "$beacon_sha"

      # TCG-13. Блокировка скиллов должна соответствовать файлам на диске.
      # --check возвращает не 0 при изменённом хеше или новом скилле, поэтому
      # правка скилла без --write останавливает PR до обновления файла.
      - name: Skills lock is current
        shell: bash
        run: |
          set -euo pipefail
          ./beacon skills-lock --check

      # Корректный конфиг проходит проверки схемы, лимитов и индекса. Строка
      # "ok <digest>" подтверждает, что проверка действительно выполнилась.
      - name: Positive config passes registry check
        shell: bash
        run: |
          set -euo pipefail
          out=$(./beacon registry check --config tools/beacon-gates/gate/config/registry.json)
          printf 'positive out=%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^ok '

      # Неизвестный ключ обязан ронять check. Код 0 означал бы, что проверка
      # слепа, поэтому job падает на любом исходе кроме 1.
      - name: Negative config fails registry check
        shell: bash
        run: |
          set -euo pipefail
          bad="$RUNNER_TEMP/registry-bad.yaml"
          cat > "$bad" <<'YAML'
          schema: beacon.agent-registry/v2
          version: "2"
          project: beacon-impl-ci
          roster:
            - id: executor
              roles: [executor]
              capabilities: [watch]
          bogus_key: typo
          YAML
          set +e
          ./beacon registry check --config "$bad"
          code=$?
          set -e
          printf 'negative exit=%d\n' "$code"
          if [ "$code" -ne 1 ]; then
            printf 'negative control failed: bad config exit=%d, want 1\n' "$code" >&2
            exit 1
          fi
