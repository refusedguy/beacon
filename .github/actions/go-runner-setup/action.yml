name: Go runner setup
description: Install Go from go.mod. Shared by the CI, registry, docs and gates workflows so Go setup has one definition.

inputs:
  cache:
    description: Value passed to the setup-go cache input.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: ${{ inputs.cache }}
